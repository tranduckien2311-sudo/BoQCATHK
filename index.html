<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="text/babel">

        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('✅ PWA ServiceWorker đã khởi chạy:', reg.scope);
                }).catch(err => {
                    console.log('⚠️ ServiceWorker không hoạt động cục bộ:', err);
                });
            });
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Lỗi Render React:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-300 dark:border-slate-700 max-w-lg w-full text-center space-y-4">
                                <div className="text-4xl">⚠️</div>
                                <h2 className="text-base font-bold text-rose-600">Đã phát hiện sự cố hiển thị</h2>
                                <p className="text-xs text-slate-500">{this.state.error?.message || "Đang tải dữ liệu..."}</p>
                                <button onClick={() => { this.setState({ hasError: false }); window.location.reload(); }} className="px-4 py-2 bg-aviation-600 hover:bg-aviation-500 text-white text-xs font-bold rounded-xl shadow">
                                    🔄 Tải lại trang
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // BỘ NHỚ RAM ĐỆM TOÀN CỤC CHỐNG MẤT DỮ LIỆU KHI CHUYỂN TAB
        const GLOBAL_DOCS_STORE = {};

        const ROMAN_NUMERALS = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI","XXII","XXIII","XXIV","XXV","XXVI","XXVII","XXVIII","XXIX","XXX","XXXI","XXXII","XXXIII","XXXIV","XXXV","XXXVI","XXXVII","XXXVIII","XXXIX","XL","XLI","XLII","XLIII","XLIV","XLV","XLVI","XLVII","XLVIII","XLIX","L","LI","LII","LIII","LIV","LV","LVI","LVII","LVIII","LIX","LX","LXI","LXII","LXIII"];
        const ROMAN_STRICT_PATTERN = "(?:LX|L|XLIX|XLVIII|XLVII|XLVI|XLV|XLIV|XLIII|XLII|XLI|XL|XXXIX|XXXVIII|XXXVII|XXXVI|XXXV|XXXIV|XXXIII|XXXII|XXXI|XXX|XXIX|XXVIII|XXVII|XXVI|XXV|XXIV|XXIII|XXII|XXI|XX|XIX|XVIII|XVII|XVI|XV|XIV|XIII|XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I|\\d+)";
        const STRICT_CODE_PATTERN = `(?:[0-9]+[a-zA-Z]?(?:\\.[0-9]+)*|LX|L|XLIX|XLVIII|XLVII|XLVI|XLV|XLIV|XLIII|XLII|XLI|XL|XXXIX|XXXVIII|XXXVII|XXXVI|XXXV|XXXIV|XXXIII|XXXII|XXXI|XXX|XXIX|XXVIII|XXVII|XXVI|XXV|XXIV|XXIII|XXII|XXI|XX|XIX|XVIII|XVII|XVI|XV|XIV|XIII|XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I)`;

        const VIETNAMESE_NUMBER_WORDS = {
            'nhất': 1, 'nhat': 1, 'một': 1, 'mot': 1,
            'hai': 2, 'nhì': 2, 'nhi': 2,
            'ba': 3, 'tam': 3,
            'bốn': 4, 'tư': 4, 'bon': 4, 'tu': 4,
            'năm': 5, 'nam': 5,
            'sáu': 6, 'sau': 6,
            'bảy': 7, 'bay': 7,
            'tám': 8, 'tam': 8,
            'chín': 9, 'chin': 9,
            'mười': 10, 'muoi': 10,
            'mười một': 11, 'mười hai': 12, 'mười ba': 13, 'mười bốn': 14, 'mười lăm': 15,
            'mười sáu': 16, 'mười bảy': 17, 'mười tám': 18, 'mười chín': 19, 'hai mươi': 20,
            'hai mươi mốt': 21, 'hai mươi hai': 22, 'hai mươi ba': 23, 'hai mươi bốn': 24
        };

        const romanToDecimal = (str) => {
            if (!str) return 0;
            const clean = String(str).toLowerCase().trim();
            if (/^\d+$/.test(clean)) return parseInt(clean, 10);
            if (VIETNAMESE_NUMBER_WORDS[clean]) return VIETNAMESE_NUMBER_WORDS[clean];

            const upper = clean.toUpperCase();
            const rMap = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
            let sum = 0;
            for (let i = 0; i < upper.length; i++) {
                const cur = rMap[upper[i]] || 0;
                const next = rMap[upper[i + 1]] || 0;
                if (cur < next) sum -= cur;
                else sum += cur;
            }
            return sum || 0;
        };

        const decimalToRoman = (num) => {
            if (!num || num <= 0) return '';
            const lookup = { M: 1000, CM: 900, D: 500, CD: 400, C: 100, XC: 90, L: 50, XL: 40, X: 10, IX: 9, V: 5, IV: 4, I: 1 };
            let roman = '';
            let n = parseInt(num, 10);
            for (let i in lookup) {
                while (n >= lookup[i]) {
                    roman += i;
                    n -= lookup[i];
                }
            }
            return roman;
        };

        const isSkippableAppendixLine = (str) => {
            const s = (str || '').trim();
            if (!s) return true;
            if (/^[\(\[\{]/.test(s)) return true;
            if (/ban\s*hành\s*kèm\s*theo|sửa\s*đổi|bổ\s*sung|bãi\s*bỏ|quy\s*định\s*tại/i.test(s)) return true;
            if (/^[\-\_\*\.\s\—\–\=]{3,}$/.test(s)) return true;
            if (/cộng\s*hòa\s*xã\s*hội\s*chủ\s*nghĩa\s*việt\s*nam/i.test(s)) return true;
            if (/độc\s*lập\s*[\-\–\—\s]*tự\s*do\s*[\-\–\—\s]*hạnh\s*phúc/i.test(s)) return true;
            if (/^(?:ngày\s+\d+|số\s*[\:\:]|kính\s*gửi)/i.test(s)) return true;
            return false;
        };

        const getPartSortValue = (partTitle) => {
            if (!partTitle) return 999;
            if (/phần\s*chung|general/i.test(partTitle)) return 0;
            const match = String(partTitle).match(/(?:PHẦN|PHAN|PART|SECTION)\s+(?:THỨ\s+)?([0-9]+|[IVXLCDM]+|[a-zA-Zàáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ\s]+)/i);
            if (match) {
                const val = match[1].trim();
                if (/^\d+$/.test(val)) return parseInt(val, 10);
                const rom = romanToDecimal(val);
                if (rom > 0) return rom;
            }
            const numMatch = String(partTitle).match(/\d+/);
            if (numMatch) return parseInt(numMatch[0], 10);
            return 999;
        };

        const naturalCompareSectionCodes = (a, b) => {
            if (a === b) return 0;
            const parseSegments = (str) => {
                const clean = String(str).replace(/^(?:ĐIỀU|Điều|Ðiều|Điều|DIEU|Dieu|Mục|Muc|Section|SECTION|Clause|Part|PART|Phần|Chương|Phụ\s*lục|PL|Appendix|Mẫu|Mau|ORG|FLT|DSP|MNT|CAB|GRH|CGO|SEC|ISM|Table|Bảng|TABLE|BẢNG)\s*[\.\:\-]?\s*/i, '').trim();
                return clean.split(/[\.\-\_\s]+/).map(seg => {
                    const num = parseInt(seg, 10);
                    return isNaN(num) ? seg.toLowerCase() : num;
                });
            };

            const segsA = parseSegments(a);
            const segsB = parseSegments(b);
            const len = Math.max(segsA.length, segsB.length);

            for (let i = 0; i < len; i++) {
                const valA = segsA[i];
                const valB = segsB[i];

                if (valA === undefined) return -1;
                if (valB === undefined) return 1;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    if (valA !== valB) return valA - valB;
                } else {
                    const cmp = String(valA).localeCompare(String(valB), undefined, { numeric: true, sensitivity: 'base' });
                    if (cmp !== 0) return cmp;
                }
            }
            return 0;
        };

        const getAppendixBadgeLabel = (app, isCurrentBoQC, isCurrentND223) => {
            if (!app) return 'Phụ lục';
            const cleanCode = String(app.code || '').replace(/^(?:phụ\s*lục|mẫu\s*số|mẫu|pl)\s*/i, '').trim();
            if (isCurrentBoQC) {
                return `Phụ lục ${cleanCode || app.id}`;
            }
            if (isCurrentND223) {
                return `Mẫu ${cleanCode || app.id}`;
            }
            if (String(app.title || '').toLowerCase().includes('mẫu') || String(app.code || '').toLowerCase().includes('mẫu')) {
                return `Mẫu ${cleanCode || app.id}`;
            }
            return `Phụ lục ${cleanCode || app.id}`;
        };

        // HÀM LIÊN KẾT TỰ ĐỘNG CHUẨN XÁC 100% VỚI KHO GITHUB MASTER
        const getAppendixOnlineUrls = (docName, app) => {
            if (!app) return { pdfUrl: "", pdfName: "", wordUrl: "", wordName: "" };
            const norm = String(docName || '').toLowerCase();
            
            // Manuals CAME, MME, MOE, IOSA, SMM không dùng kho phụ lục NĐ
            if (/(?:came|moe|mme|manual|smm|om|sop|handbook|iosa|ism)/i.test(norm)) {
                return { pdfUrl: "", pdfName: "", wordUrl: "", wordName: "" };
            }

            const rawCode = String(app.code || '').trim();
            const rawTitle = String(app.title || '').trim();

            let num = null;
            const codeNumMatch = rawCode.match(/\d+/);
            const titleNumMatch = rawTitle.match(/(?:mẫu\s*số|mẫu|phụ\s*lục|pl)\s*(\d+)/i) || rawTitle.match(/\d+/);
            if (codeNumMatch) {
                num = parseInt(codeNumMatch[0], 10);
            } else if (titleNumMatch) {
                num = parseInt(titleNumMatch[1] || titleNumMatch[0], 10);
            }

            let roman = "";
            if (rawCode && /^[IVXLCDM]+$/i.test(rawCode)) {
                roman = rawCode.toUpperCase();
            } else {
                const romanMatch = rawTitle.match(/(?:phụ\s*lục|pl|appendix)\s+([IVXLCDM]+)\b/i);
                if (romanMatch) {
                    roman = romanMatch[1].toUpperCase();
                } else if (num && num > 0 && num <= 63) {
                    roman = decimalToRoman(num);
                }
            }

            if (!num && roman) {
                num = romanToDecimal(roman);
            }

            const padded = num !== null ? String(num).padStart(2, '0') : '01';

            let pdfUrl = "";
            let pdfName = "";
            let wordUrl = "";
            let wordName = "";

            if (norm.includes('221')) {
                const isMau = rawTitle.toLowerCase().includes('mẫu') || rawCode.toLowerCase().includes('mẫu');
                if (isMau && num !== null) {
                    pdfUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucND221/Pdf/ND_221_2026_N%C4%90-CP-Phu%20Luc_VIII_Mau%20${padded}.pdf`;
                    pdfName = `ND_221_2026_NĐ-CP-Phu Luc_VIII_Mau ${padded}.pdf`;
                    wordUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucND221/Word/Mau_${padded}.docx`;
                    wordName = `Mau_${padded}.docx`;
                } else if (roman) {
                    pdfUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucND221/Pdf/ND_221_2026_N%C4%90-CP-Phu%20Luc_${roman}.pdf`;
                    pdfName = `ND_221_2026_NĐ-CP-Phu Luc_${roman}.pdf`;
                    wordUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucND221/Word/Phu_luc_${num || 1}.docx`;
                    wordName = `Phu_luc_${num || 1}.docx`;
                }
            } else if (norm.includes('223')) {
                if (num !== null && num <= 27) {
                    pdfUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucND223/Pdf/ND_223_2026_N%C4%90-CP_Phu%20Luc_Mau%20${padded}.pdf`;
                    pdfName = `ND_223_2026_NĐ-CP_Phu Luc_Mau ${padded}.pdf`;
                    wordUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucND223/Word/Mau_So_${padded}.docx`;
                    wordName = `Mau_So_${padded}.docx`;
                }
            } else {
                // Mặc định hoặc Bộ Quy Chế (Chính)
                if (roman) {
                    pdfUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucBoQCHK/Pdf/BoQCATHK_PHU%20LUC_${roman}.pdf`;
                    pdfName = `BoQCATHK_PHU LUC_${roman}.pdf`;
                    wordUrl = `https://raw.githubusercontent.com/tranduckien2311-sudo/BoQCATHK/main/PhuLuc/PhuLucBoQCHK/Word/BoQCATHK_Phu%20Luc_Phu_luc_${roman}.docx`;
                    wordName = `BoQCATHK_Phu Luc_Phu_luc_${roman}.docx`;
                }
            }

            return { pdfUrl, pdfName, wordUrl, wordName };
        };

        const ensureAppendixUrls = (targetApp, docName) => {
            if (!targetApp) return targetApp;
            if (!targetApp.pdfFileUrl || !targetApp.wordFileUrl) {
                const urls = getAppendixOnlineUrls(docName, targetApp);
                if (urls.pdfUrl && !targetApp.pdfFileUrl) {
                    targetApp.pdfFileUrl = urls.pdfUrl;
                    targetApp.pdfFileName = targetApp.pdfFileName || urls.pdfName;
                }
                if (urls.wordUrl && !targetApp.wordFileUrl) {
                    targetApp.wordFileUrl = urls.wordUrl;
                    targetApp.wordFileName = targetApp.wordFileName || urls.wordName;
                }
            }
            return targetApp;
        };

        const renderTextWithHyperlinks = (text, onJump) => {
            if (!text || typeof text !== 'string') return text;
            
            const linkRegex = /(?:(?:ORG|FLT|DSP|MNT|CAB|GRH|CGO|SEC|ISM)\s+[1-9]\d*\.\d+(?:\.\d+)*)|(?:(?:Table|Bảng|TABLE|BẢNG)\s+[1-9]\d*\.\d+(?:\.\d+)*)|(?:(?:ĐIỀU|Điều|Ðiều|Điều|DIEU|Dieu)\s*[\.\:\-]?\s*(\d+[a-zA-Z]?(?:\.\d+)*))|(?:(?:Mục|Muc|Section|Clause|Item)\s*(\d+\.\d+(?:\.\d+)*))|(?:(?:Phụ\s*lục|Phu\s*luc|Appendix|Attachment|Mẫu|Mau)\s*([0-9A-Za-zIVXLCDM\.\_\-]+))|(\b[1-9]\d*\.\d+(?:\.\d+)+\b)/gi;
            
            const elements = [];
            let lastIndex = 0;
            let match;
            let keyCounter = 0;

            while ((match = linkRegex.exec(text)) !== null) {
                const matchStart = match.index;
                const matchEnd = linkRegex.lastIndex;
                const fullMatch = match[0];

                if (matchStart > lastIndex) {
                    elements.push(text.substring(lastIndex, matchStart));
                }

                let targetCode = (match[1] || match[2] || match[3] || match[4] || fullMatch).trim();
                let isAppendix = /(?:Phụ\s*lục|Phu\s*luc|Appendix|Attachment|Mẫu|Mau)/i.test(fullMatch);

                elements.push(
                    <span
                        key={`link_${keyCounter++}`}
                        onClick={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            if (onJump) onJump({ code: targetCode, isAppendix: isAppendix, raw: fullMatch });
                        }}
                        className="inline-flex items-center gap-0.5 text-aviation-600 dark:text-aviation-400 font-bold underline decoration-aviation-400 hover:text-aviation-800 dark:hover:text-aviation-200 cursor-pointer bg-aviation-50/80 dark:bg-aviation-950/60 px-1 py-0.5 rounded transition hover:scale-105 select-none mx-0.5"
                        title={`Bấm để mở [${fullMatch}]`}
                    >
                        <span>🔗</span>
                        <span>{fullMatch}</span>
                    </span>
                );

                lastIndex = matchEnd;
            }

            if (lastIndex < text.length) {
                elements.push(text.substring(lastIndex));
            }

            return elements.length > 0 ? elements : text;
        };

        const renderFormattedContent = (content, onJump) => {
            if (!content) return null;
            const lines = content.split('\n');
            
            const headingRegex = /^(\d+(\.\d+){2,}\.?\s*.*)$/i;
            const labelRegex = /^(reference|căn cứ|note|lưu ý|purpose|mục đích|scope|phạm vi|procedure|quy trình|responsibility|trách nhiệm|yêu cầu)\s*[:\-–]/i;
            const clauseRegex = /^(khoản\s+\d+|điểm\s+[a-zđ]|mục\s+\d+|chương\s+\d+|phần\s+\d+)/i;

            return lines.map((line, idx) => {
                const trimmed = line.trim();
                if (!trimmed) {
                    return <div key={idx} className="h-2"></div>;
                }

                if (headingRegex.test(trimmed)) {
                    return (
                        <div key={idx} className="mt-3.5 mb-1.5 font-bold text-slate-900 dark:text-white text-[14px] bg-slate-100/90 dark:bg-slate-800/90 px-2.5 py-1 rounded border-l-4 border-aviation-600 shadow-xs">
                            {renderTextWithHyperlinks(line, onJump)}
                        </div>
                    );
                }

                if (labelRegex.test(trimmed) || clauseRegex.test(trimmed)) {
                    return (
                        <div key={idx} className="mt-2.5 mb-1 font-bold text-aviation-800 dark:text-aviation-300 text-[13px]">
                            {renderTextWithHyperlinks(line, onJump)}
                        </div>
                    );
                }

                return (
                    <p key={idx} className="mb-1.5 leading-relaxed text-slate-800 dark:text-slate-200 text-[13.5px]">
                        {renderTextWithHyperlinks(line, onJump)}
                    </p>
                );
            });
        };

        const extractReferencesFromAiText = (text, docsList, activeDocId, activeDocName, articlesMap, appendicesMap) => {
            if (!text || typeof text !== 'string') return [];
            const results = [];
            const seen = new Set();

            const refRegex = /(?:(?:ORG|FLT|DSP|MNT|CAB|GRH|CGO|SEC|ISM)\s+[1-9]\d*\.\d+(?:\.\d+)*)|(?:(?:Table|Bảng|TABLE|BẢNG)\s+[1-9]\d*\.\d+(?:\.\d+)*)|(?:(?:ĐIỀU|Điều|Ðiều|Điều|DIEU|Dieu)\s*[\.\:\-]?\s*(\d+[a-zA-Z]?(?:\.\d+)*))|(?:(?:Mục|Muc|Section|Clause|Item)\s*(\d+\.\d+(?:\.\d+)*))|(?:(?:Phụ\s*lục|Phu\s*luc|Appendix|Attachment|Mẫu|Mau)\s*([0-9A-Za-zIVXLCDM\.\_\-]+))|(\b[1-9]\d*\.\d+(?:\.\d+)*\b)/gi;

            const allArts = articlesMap ? Object.values(articlesMap) : [];
            const allApps = appendicesMap ? Object.values(appendicesMap) : [];

            let match;
            while ((match = refRegex.exec(text)) !== null) {
                const fullMatch = match[0].trim();
                const rawCode = (match[1] || match[2] || match[3] || match[4] || fullMatch).trim();
                const uniqueKey = rawCode.toLowerCase();
                const fullKey = fullMatch.toLowerCase();
                if (!rawCode || seen.has(uniqueKey) || seen.has(fullKey)) continue;

                const matchedArt = allArts.find(a => 
                    String(a.id).trim().toLowerCase() === fullKey ||
                    String(a.id).trim().toLowerCase() === uniqueKey ||
                    (a.code && a.code.toLowerCase().trim() === fullKey) ||
                    (a.code && a.code.toLowerCase().trim() === uniqueKey) ||
                    (a.code && a.code.toLowerCase().replace(/^(?:mục|section|điều)\s*/i, '').trim() === uniqueKey)
                );

                if (matchedArt) {
                    seen.add(uniqueKey);
                    seen.add(fullKey);
                    results.push({
                        docId: activeDocId,
                        docName: activeDocName,
                        type: 'article',
                        id: matchedArt.id,
                        code: matchedArt.code || matchedArt.id,
                        raw: fullMatch,
                        title: matchedArt.title
                    });
                    continue;
                }

                const matchedApp = allApps.find(app =>
                    String(app.id).toLowerCase() === uniqueKey ||
                    String(app.code || '').toLowerCase() === uniqueKey ||
                    (app.code && app.code.toLowerCase().replace(/^(?:phụ lục|appendix|mẫu|mau)\s*/i, '').trim() === uniqueKey)
                );

                if (matchedApp) {
                    seen.add(uniqueKey);
                    results.push({
                        docId: activeDocId,
                        docName: activeDocName,
                        type: 'appendix',
                        id: matchedApp.id,
                        code: matchedApp.code ? (matchedApp.title.toLowerCase().includes('mẫu') ? `Mẫu ${matchedApp.code}` : `Phụ lục ${matchedApp.code}`) : matchedApp.title,
                        raw: fullMatch,
                        title: matchedApp.title
                    });
                    continue;
                }

                if (/^[A-Z]+\s+\d+\.\d+/i.test(fullMatch) || /^Table\s+\d+\.\d+/i.test(fullMatch) || /^\d+(\.\d+)+$/.test(rawCode)) {
                    seen.add(uniqueKey);
                    seen.add(fullKey);
                    results.push({
                        docId: activeDocId,
                        docName: activeDocName,
                        type: 'article',
                        id: fullMatch,
                        code: fullMatch,
                        raw: fullMatch,
                        title: fullMatch
                    });
                }
            }

            return results;
        };

        const solidParseJson = (rawText) => {
            if (!rawText || typeof rawText !== 'string') {
                throw new Error("Phản hồi từ AI trống.");
            }
            let cleaned = rawText.trim();
            cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

            try {
                const parsed = JSON.parse(cleaned);
                if (Array.isArray(parsed)) return parsed;
                if (parsed && typeof parsed === 'object') return [parsed];
            } catch (e) {}

            const firstBracket = cleaned.indexOf('[');
            const firstBrace = cleaned.indexOf('{');

            if (firstBracket !== -1 && (firstBrace === -1 || firstBracket < firstBrace)) {
                const lastBracket = cleaned.lastIndexOf(']');
                if (lastBracket !== -1 && lastBracket > firstBracket) {
                    try {
                        const sub = cleaned.substring(firstBracket, lastBracket + 1);
                        const parsed = JSON.parse(sub);
                        if (Array.isArray(parsed)) return parsed;
                    } catch (e) {}
                }
            }

            if (firstBrace !== -1) {
                const lastBrace = cleaned.lastIndexOf('}');
                if (lastBrace !== -1 && lastBrace > firstBrace) {
                    try {
                        const sub = cleaned.substring(firstBrace, lastBrace + 1);
                        const parsed = JSON.parse(sub);
                        if (Array.isArray(parsed)) return parsed;
                        if (parsed && typeof parsed === 'object') return [parsed];
                    } catch (e) {}
                }
            }

            throw new Error("AI không trả về cấu trúc JSON hợp lệ.");
        };

        const quickGoogleTranslate = async (text, targetLang = 'vi', sourceLang = 'auto') => {
            if (!text || !text.trim()) return '';
            
            const paragraphs = text.split('\n');
            const chunks = [];
            let currentChunk = '';
            
            for (const p of paragraphs) {
                if ((currentChunk + '\n' + p).length > 1500) {
                    if (currentChunk) chunks.push(currentChunk);
                    currentChunk = p;
                } else {
                    currentChunk = currentChunk ? (currentChunk + '\n' + p) : p;
                }
            }
            if (currentChunk) chunks.push(currentChunk);
            
            const translatedChunks = [];
            for (const chunk of chunks) {
                if (!chunk.trim()) {
                    translatedChunks.push('');
                    continue;
                }
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sourceLang)}&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(chunk)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Không thể kết nối máy chủ dịch thuật");
                const data = await res.json();
                if (data && data[0] && Array.isArray(data[0])) {
                    const piece = data[0].map(item => (item && item[0]) ? item[0] : '').join('');
                    translatedChunks.push(piece);
                } else {
                    translatedChunks.push(chunk);
                }
            }
            return translatedChunks.join('\n');
        };

        const formatOptionText = (text, maxLen = 60) => {
            if (!text || typeof text !== 'string') return '';
            const clean = text.replace(/\s+/g, ' ').trim();
            if (clean.length <= maxLen) return clean;
            return clean.substring(0, maxLen - 3) + '...';
        };

        const sanitizeFileName = (name, defaultExt = '') => {
            if (!name || typeof name !== 'string') return 'TaiLieu' + (defaultExt ? '.' + defaultExt : '');
            let clean = name.replace(/[/\\:*?"<>|\r\n\t]/g, '_').trim();
            clean = clean.replace(/\s+/g, ' ').replace(/\.+$/, '');
            if (defaultExt) {
                const extRegex = new RegExp('\\.' + defaultExt + '$', 'i');
                if (!extRegex.test(clean)) clean += '.' + defaultExt;
            }
            return clean || ('TaiLieu' + (defaultExt ? '.' + defaultExt : ''));
        };

        const generateWordDocFromText = (title, text) => {
            const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${title}</title><style>body{font-family:'Times New Roman',serif;font-size:14pt;line-height:1.5;}</style></head>
<body><h2>${title}</h2><p>${(text || '').replace(/\n/g, '<br/>')}</p></body></html>`;
            return new Blob(['\ufeff', html], { type: 'application/msword' });
        };

        function dataURLtoBlob(dataurl) {
            if (!dataurl) return null;
            if (dataurl instanceof Blob) return dataurl;
            if (typeof dataurl !== 'string') return null;

            try {
                let mime = 'application/octet-stream';
                let b64Data = dataurl;

                if (dataurl.startsWith('data:')) {
                    const parts = dataurl.split(',');
                    const mimeMatch = parts[0].match(/:(.*?);/);
                    if (mimeMatch) mime = mimeMatch[1];
                    b64Data = parts[1] || '';
                }

                const cleanB64 = b64Data.replace(/[\s\r\n]/g, '');
                const byteCharacters = atob(cleanB64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                return new Blob([new Uint8Array(byteNumbers)], { type: mime });
            } catch (e) {
                return new Blob([dataurl], { type: 'text/plain;charset=utf-8' });
            }
        }

        const triggerFileDownload = async (dataOrUrl, filename) => {
            if (!dataOrUrl) return;
            try {
                const cleanName = sanitizeFileName(filename);
                if (typeof dataOrUrl === 'string' && (dataOrUrl.startsWith('http://') || dataOrUrl.startsWith('https://'))) {
                    try {
                        const res = await fetch(dataOrUrl);
                        if (res.ok) {
                            const blob = await res.blob();
                            const blobUrl = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = blobUrl;
                            a.download = cleanName;
                            document.body.appendChild(a);
                            a.click();
                            setTimeout(() => {
                                document.body.removeChild(a);
                                URL.revokeObjectURL(blobUrl);
                            }, 10000);
                            return;
                        }
                    } catch (e) {
                        window.open(dataOrUrl, '_blank');
                        return;
                    }
                }

                let blob = null;
                if (dataOrUrl instanceof Blob) blob = dataOrUrl;
                else if (typeof dataOrUrl === 'string') {
                    if (dataOrUrl.startsWith('blob:')) {
                        const a = document.createElement('a');
                        a.href = dataOrUrl;
                        a.download = cleanName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        return;
                    } else blob = dataURLtoBlob(dataOrUrl);
                }

                if (!blob) return;
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = cleanName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    if (document.body.contains(a)) document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 30000);
            } catch (err) {
                console.error("Lỗi triggerFileDownload:", err);
            }
        };

        const copyToClipboard = async (text) => {
            if (!text) return false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                return successful;
            } catch (err) {
                return false;
            }
        };

        // =========================================================================
        // UNIVERSAL PDF VIEWER (XỬ LÝ AN TOÀN URL GITHUB & BASE64)
        // =========================================================================
        function PdfPageItem({ pdfDoc, pageNum, scale, isCurrentPageMatch, searchQuery }) {
            const canvasRef = React.useRef(null);
            const renderTaskRef = React.useRef(null);
            const [highlights, setHighlights] = React.useState([]);

            // 1. Render trang PDF lên Canvas
            React.useEffect(() => {
                if (!pdfDoc) return;
                let isCancelled = false;

                pdfDoc.getPage(pageNum).then(page => {
                    if (isCancelled) return;
                    const canvas = canvasRef.current;
                    if (!canvas) return;

                    const dpr = Math.min(window.devicePixelRatio || 1, 2.2);
                    const viewport = page.getViewport({ scale: scale * dpr });
                    const context = canvas.getContext('2d');

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.style.width = `${viewport.width / dpr}px`;
                    canvas.style.height = `${viewport.height / dpr}px`;

                    if (renderTaskRef.current) {
                        renderTaskRef.current.cancel();
                    }
                    const renderTask = page.render({ canvasContext: context, viewport: viewport });
                    renderTaskRef.current = renderTask;
                    renderTask.promise.catch(() => {});
                });

                return () => {
                    isCancelled = true;
                    if (renderTaskRef.current) renderTaskRef.current.cancel();
                };
            }, [pdfDoc, pageNum, scale]);

            // 2. Tính toán tọa độ để HIGHLIGHT CHÍNH XÁC TỪ KHÓA trên mặt chữ
            React.useEffect(() => {
                if (!pdfDoc || !searchQuery || !searchQuery.trim()) {
                    setHighlights([]);
                    return;
                }

                let isCancelled = false;
                const q = searchQuery.trim().toLowerCase();

                pdfDoc.getPage(pageNum).then(async (page) => {
                    const textContent = await page.getTextContent();
                    if (isCancelled) return;

                    const cssViewport = page.getViewport({ scale: scale });
                    const boxes = [];

                    for (const item of textContent.items) {
                        const str = item.str || '';
                        const lowerStr = str.toLowerCase();
                        let startIdx = 0;

                        while ((startIdx = lowerStr.indexOf(q, startIdx)) !== -1) {
                            const itemX = item.transform[4];
                            const itemY = item.transform[5];
                            const itemWidth = item.width || (str.length * 8);
                            const itemHeight = item.height || Math.abs(item.transform[3]) || 10;

                            const charWidth = itemWidth / (str.length || 1);
                            const subX = itemX + (startIdx * charWidth);
                            const subWidth = Math.max(q.length * charWidth, 12);

                            const rect = [subX, itemY, subX + subWidth, itemY + itemHeight];
                            const viewRect = cssViewport.convertToViewportRectangle(rect);

                            const left = Math.min(viewRect[0], viewRect[2]);
                            const top = Math.min(viewRect[1], viewRect[3]);
                            const width = Math.abs(viewRect[0] - viewRect[2]);
                            const height = Math.abs(viewRect[1] - viewRect[3]);

                            boxes.push({
                                key: `${pageNum}_${boxes.length}`,
                                left,
                                top,
                                width,
                                height
                            });

                            startIdx += q.length;
                        }
                    }

                    if (!isCancelled) {
                        setHighlights(boxes);
                    }
                });

                return () => { isCancelled = true; };
            }, [pdfDoc, pageNum, scale, searchQuery]);

            return (
                <div 
                    id={`pdf-page-item-${pageNum}`} 
                    data-page-num={pageNum} 
                    className={`pdf-page-wrapper relative flex flex-col items-center mb-6 transition-all ${
                        isCurrentPageMatch ? 'ring-4 ring-amber-400 p-1 rounded-xl bg-amber-500/10 shadow-2xl' : ''
                    }`}
                >
                    <div className="text-[10px] text-slate-400 dark:text-slate-500 font-semibold mb-1 select-none">
                        Trang {pageNum} {highlights.length > 0 && <span className="text-amber-500 font-bold">({highlights.length} từ khớp)</span>}
                    </div>

                    <div className="relative inline-block">
                        <canvas 
                            ref={canvasRef} 
                            className="shadow-xl rounded-lg bg-white block max-w-none border border-slate-200 dark:border-slate-700" 
                        />

                        {/* LỚP PHỦ HIGHLIGHT TRỰC TIẾP TRÊN TỪNG TỪ KHÓA */}
                        <div className="absolute inset-0 pointer-events-none overflow-hidden rounded-lg">
                            {highlights.map((h) => (
                                <div
                                    key={h.key}
                                    style={{
                                        position: 'absolute',
                                        left: `${h.left}px`,
                                        top: `${h.top}px`,
                                        width: `${h.width}px`,
                                        height: `${h.height}px`,
                                    }}
                                    className={`mix-blend-multiply rounded-xs transition-all ${
                                        isCurrentPageMatch
                                            ? 'bg-amber-300/60 border border-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.8)] animate-pulse'
                                            : 'bg-yellow-300/40 border border-yellow-400'
                                    }`}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function UniversalPdfViewer({ base64Data, fileName, title }) {
            const [numPages, setNumPages] = React.useState(0);
            const [currentVisiblePage, setCurrentVisiblePage] = React.useState(1);
            const [scale, setScale] = React.useState(window.innerWidth < 640 ? 1.0 : 1.25);
            const [loading, setLoading] = React.useState(true);
            const [error, setError] = React.useState(null);

            const [showSearch, setShowSearch] = React.useState(false);
            const [searchQuery, setSearchQuery] = React.useState('');
            const [searchResults, setSearchResults] = React.useState([]);
            const [currentMatchIdx, setCurrentMatchIdx] = React.useState(0);
            const [isSearching, setIsSearching] = React.useState(false);

            const containerRef = React.useRef(null);
            const pdfDocRef = React.useRef(null);
            const touchPinchDistRef = React.useRef(null);
            const touchInitialScaleRef = React.useRef(scale);

            React.useEffect(() => {
                if (!base64Data) {
                    setLoading(false);
                    return;
                }
                setLoading(true);
                setError(null);
                let isCancelled = false;

                const loadPdfSource = async () => {
                    try {
                        let docSource = base64Data;
                        
                        // Nếu là URL online (GitHub Raw), tải ArrayBuffer để tránh chặn CORS PDF.js
                        if (typeof base64Data === 'string' && (base64Data.startsWith('http://') || base64Data.startsWith('https://'))) {
                            try {
                                const res = await fetch(base64Data);
                                if (!res.ok) throw new Error(`HTTP error ${res.status}`);
                                const arrayBuf = await res.arrayBuffer();
                                docSource = { data: new Uint8Array(arrayBuf) };
                            } catch (e) {
                                console.warn("Fetch trực tiếp không thành công, thử nạp qua link:", e);
                                docSource = base64Data;
                            }
                        } else if (typeof base64Data === 'string' && (base64Data.startsWith('data:') || /^[A-Za-z0-9+/=\s\r\n]+$/.test(base64Data.substring(0, 100)))) {
                            const rawBase64 = base64Data.includes(',') ? base64Data.split(',')[1].replace(/[\s\r\n]/g, '') : base64Data.replace(/[\s\r\n]/g, '');
                            const binaryStr = atob(rawBase64);
                            const bytes = new Uint8Array(binaryStr.length);
                            for (let i = 0; i < binaryStr.length; i++) {
                                bytes[i] = binaryStr.charCodeAt(i);
                            }
                            docSource = { data: bytes };
                        }

                        if (window.pdfjsLib) {
                            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                            const loadingTask = window.pdfjsLib.getDocument(docSource);
                            const pdf = await loadingTask.promise;
                            if (!isCancelled) {
                                pdfDocRef.current = pdf;
                                setNumPages(pdf.numPages);
                                setCurrentVisiblePage(1);
                                setLoading(false);
                            }
                        } else {
                            if (!isCancelled) setLoading(false);
                        }
                    } catch (e) {
                        if (!isCancelled) {
                            console.error("Lỗi nạp PDF:", e);
                            setLoading(false);
                            setError("Không thể nạp trực tiếp file PDF này.");
                        }
                    }
                };

                loadPdfSource();
                return () => { isCancelled = true; };
            }, [base64Data]);

            React.useEffect(() => {
                const container = containerRef.current;
                if (!container || numPages === 0) return;

                const handleScroll = () => {
                    const pageEls = container.querySelectorAll('.pdf-page-wrapper');
                    const containerTop = container.getBoundingClientRect().top;

                    for (let i = 0; i < pageEls.length; i++) {
                        const rect = pageEls[i].getBoundingClientRect();
                        if (rect.bottom > containerTop + 60) {
                            const pNum = parseInt(pageEls[i].getAttribute('data-page-num'), 10);
                            if (pNum && pNum !== currentVisiblePage) {
                                setCurrentVisiblePage(pNum);
                            }
                            break;
                        }
                    }
                };

                container.addEventListener('scroll', handleScroll, { passive: true });
                return () => container.removeEventListener('scroll', handleScroll);
            }, [numPages, currentVisiblePage]);

            React.useEffect(() => {
                const el = containerRef.current;
                if (!el) return;

                const handleWheelZoom = (e) => {
                    if (e.shiftKey || e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        const delta = e.deltaY < 0 ? 0.15 : -0.15;
                        setScale(s => Math.min(4.0, Math.max(0.4, Number((s + delta).toFixed(2)))));
                    }
                };

                el.addEventListener('wheel', handleWheelZoom, { passive: false });
                return () => el.removeEventListener('wheel', handleWheelZoom);
            }, []);

            const handleTouchStart = (e) => {
                if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    touchPinchDistRef.current = dist;
                    touchInitialScaleRef.current = scale;
                }
            };

            const handleTouchMove = (e) => {
                if (e.touches.length === 2 && touchPinchDistRef.current) {
                    e.preventDefault();
                    const newDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = newDist / touchPinchDistRef.current;
                    const newScale = Math.min(4.0, Math.max(0.4, Number((touchInitialScaleRef.current * factor).toFixed(2))));
                    setScale(newScale);
                }
            };

            const handleTouchEnd = () => {
                touchPinchDistRef.current = null;
            };

            const executePdfSearch = async (query) => {
                if (!query || !query.trim() || !pdfDocRef.current) {
                    setSearchResults([]);
                    setCurrentMatchIdx(0);
                    return;
                }
                setIsSearching(true);
                const q = query.trim().toLowerCase();
                const matchedPages = [];
                const pdf = pdfDocRef.current;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ').toLowerCase();

                    if (pageText.includes(q)) {
                        matchedPages.push(pageNum);
                    }
                }

                setSearchResults(matchedPages);
                setCurrentMatchIdx(0);
                setIsSearching(false);

                if (matchedPages.length > 0) {
                    scrollToPdfPage(matchedPages[0]);
                }
            };

            const scrollToPdfPage = (pNum) => {
                const el = document.getElementById(`pdf-page-item-${pNum}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            };

            const handleNextMatch = () => {
                if (searchResults.length === 0) return;
                const next = (currentMatchIdx + 1) % searchResults.length;
                setCurrentMatchIdx(next);
                scrollToPdfPage(searchResults[next]);
            };

            const handlePrevMatch = () => {
                if (searchResults.length === 0) return;
                const prev = (currentMatchIdx - 1 + searchResults.length) % searchResults.length;
                setCurrentMatchIdx(prev);
                scrollToPdfPage(searchResults[prev]);
            };

            const zoomIn = () => setScale(s => Math.min(4.0, Number((s + 0.15).toFixed(2))));
            const zoomOut = () => setScale(s => Math.max(0.4, Number((s - 0.15).toFixed(2))));
            const zoomReset = () => setScale(window.innerWidth < 640 ? 1.0 : 1.25);

            return (
                <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-300 dark:border-slate-700 shadow-lg select-none">
                    {/* THANH ĐIỀU KHIỂN TOP BAR */}
                    <div className="bg-slate-800 text-white p-2 flex flex-wrap items-center justify-between gap-2 text-xs shrink-0 z-10">
                        <div className="flex items-center gap-2">
                            <span className="font-bold truncate max-w-[120px] sm:max-w-xs">{fileName || title || 'Xem PDF'}</span>
                            {numPages > 0 && (
                                <span className="bg-slate-700 px-2 py-0.5 rounded text-[11px] font-bold text-emerald-300">
                                    Trang {currentVisiblePage} / {numPages}
                                </span>
                            )}
                        </div>

                        <div className="flex items-center gap-1.5 flex-wrap">
                            <button 
                                onClick={() => {
                                    setShowSearch(!showSearch);
                                    if (showSearch) { setSearchQuery(''); setSearchResults([]); }
                                }}
                                className={`px-2.5 py-1 rounded font-bold transition flex items-center gap-1 ${showSearch ? 'bg-amber-500 text-slate-900 shadow' : 'bg-slate-700 hover:bg-slate-600 text-white'}`}
                                title="Tìm kiếm từ khóa trong PDF"
                            >
                                <span>🔍</span>
                                <span>Tìm kiếm</span>
                            </button>

        const getEmbeddedWorkspace = () => {

        const IDB_NAME = 'AviationSafety_MultiDocWorkspace_V4';
        let dbInstance = null;
        const WorkspaceDB = {
            open: function() {
                if (dbInstance) return Promise.resolve(dbInstance);
                return new Promise((resolve) => {
                    try {
                        if (!window.indexedDB) {
                            resolve(null);
                            return;
                        }
                        const request = indexedDB.open(IDB_NAME, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('workspace')) {
                                db.createObjectStore('workspace', { keyPath: 'key' });
                            }
                        };
                        request.onsuccess = (e) => {
                            dbInstance = e.target.result;
                            resolve(dbInstance);
                        };
                        request.onerror = () => resolve(null);
                        request.onblocked = () => resolve(null);
                    } catch (e) {
                        resolve(null);
                    }
                });
            },
            put: async function(key, data) {
                if (data && key !== 'docs_meta') {
                    GLOBAL_DOCS_STORE[key] = data;
                }
                const db = await this.open();
                if (!db) return true;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readwrite');
                        tx.objectStore('workspace').put({ key, data });
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            },
            get: async function(key) {
                if (GLOBAL_DOCS_STORE[key]) {
                    return GLOBAL_DOCS_STORE[key];
                }
                const db = await this.open();
                if (!db) return null;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readonly');
                        const req = tx.objectStore('workspace').get(key);
                        req.onsuccess = () => {
                            const res = req.result ? req.result.data : null;
                            if (res && key !== 'docs_meta') GLOBAL_DOCS_STORE[key] = res;
                            resolve(res);
                        };
                        req.onerror = () => resolve(null);
                    } catch (e) { resolve(null); }
                });
            },
            getAllEntries: async function() {
                const db = await this.open();
                if (!db) {
                    return Object.keys(GLOBAL_DOCS_STORE).map(k => ({ key: k, data: GLOBAL_DOCS_STORE[k] }));
                }
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readonly');
                        const req = tx.objectStore('workspace').getAll();
                        req.onsuccess = () => {
                            const entries = req.result || [];
                            entries.forEach(e => {
                                if (e.key !== 'docs_meta') GLOBAL_DOCS_STORE[e.key] = e.data;
                            });
                            resolve(entries);
                        };
                        req.onerror = () => resolve([]);
                    } catch (e) { resolve([]); }
                });
            },
            remove: async function(key) {
                delete GLOBAL_DOCS_STORE[key];
                const db = await this.open();
                if (!db) return true;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readwrite');
                        tx.objectStore('workspace').delete(key);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            },
            clearAll: async function() {
                Object.keys(GLOBAL_DOCS_STORE).forEach(k => delete GLOBAL_DOCS_STORE[k]);
                const db = await this.open();
                if (!db) return true;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readwrite');
                        tx.objectStore('workspace').clear();
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            }
        };

        const AviationDB = (() => {
            let loadedArticles = {};
            let loadedParts = [];
            let loadedAppendices = {};
            const cache = new Map();

            const fallbackArticle = (id) => ({
                id: id,
                code: String(id),
                title: `Mục ${id}`,
                chapter: "",
                partTitle: "Văn bản chưa nạp",
                partId: '0',
                htmlContent: `<p>Nội dung chi tiết của Mục ${id} chưa được nạp từ file.</p>`,
                plainText: `Nội dung chi tiết của Mục ${id} chưa được nạp từ file.`,
                translatedText: "",
                isVerbatim: false
            });

            return {
                setLoadedPackage: (pkg) => {
                    if (!pkg) {
                        loadedArticles = {};
                        loadedParts = [];
                        loadedAppendices = {};
                    } else {
                        loadedArticles = pkg.articles || {};
                        loadedParts = pkg.parts || [];
                        loadedAppendices = pkg.appendices || {};
                    }
                    cache.clear();
                },
                getRawPackage: () => ({
                    articles: loadedArticles,
                    parts: loadedParts,
                    appendices: loadedAppendices
                }),
                getArticlesMap: () => loadedArticles,
                getParts: () => loadedParts,
                getAppendicesMap: () => loadedAppendices,
                getTotalCount: () => Object.keys(loadedArticles || {}).length,
                getAllIds: () => Object.keys(loadedArticles || {}).sort(naturalCompareSectionCodes),
                getArticle: (id) => {
                    const key = String(id);
                    if (cache.has(key)) return cache.get(key);
                    let record = (loadedArticles && loadedArticles[key]) ? loadedArticles[key] : fallbackArticle(key);
                    if (!record.htmlContent && record.plainText) {
                        record.htmlContent = `<p>${record.plainText}</p>`;
                    }
                    cache.set(key, record);
                    return record;
                },
                query: ({ search = '', partId = 'all' } = {}) => {
                    const res = [];
                    const q = (search || '').toLowerCase().trim();
                    const allIds = AviationDB.getAllIds();

                    for (let id of allIds) {
                        const art = AviationDB.getArticle(id);
                        if (!art) continue;
                        if (partId !== 'all' && String(art.partId) !== String(partId)) continue;
                        if (q) {
                            const match = (art.title || '').toLowerCase().includes(q) ||
                                          (art.plainText || '').toLowerCase().includes(q) ||
                                          (art.code || '').toLowerCase().includes(q) ||
                                          String(art.id).toLowerCase() === q ||
                                          `điều ${art.id}`.toLowerCase().includes(q) ||
                                          `mục ${art.id}`.toLowerCase().includes(q) ||
                                          `section ${art.id}`.toLowerCase().includes(q);
                            if (!match) continue;
                        }
                        res.push(art);
                    }
                    return res;
                },
                queryAppendices: (search = '') => {
                    const q = (search || '').toLowerCase().trim();
                    const list = Object.values(loadedAppendices || {}).sort((a, b) => naturalCompareSectionCodes(a.code || a.id, b.code || b.id));
                    if (!q) return list;
                    return list.filter(app => 
                        (app.title || '').toLowerCase().includes(q) || 
                        (app.code || '').toLowerCase().includes(q) ||
                        (app.plainText || '').toLowerCase().includes(q)
                    );
                }
            };
        })();

                if (!pkg) {
                    pkg = await WorkspaceDB.get(docId);
                }
                if (!pkg && onlineWorkspaceData && onlineWorkspaceData.data && onlineWorkspaceData.data[docId]) {
                    pkg = onlineWorkspaceData.data[docId];
                }
                if (!pkg && isStandaloneMode && EMBEDDED_WORKSPACE?.data && EMBEDDED_WORKSPACE.data[docId]) {
                    pkg = EMBEDDED_WORKSPACE.data[docId];
                }

                if (pkg && (pkg.articles || pkg.pdfUrl)) {
                    GLOBAL_DOCS_STORE[docId] = pkg;

                    if (pkg.articles) {
                        // Đảm bảo toàn bộ link phụ lục được kết nối chuẩn
                        const dName = pkg.name || docs.find(d => d.id === docId)?.name || docId;
                        if (pkg.appendices) {
                            Object.values(pkg.appendices).forEach(app => {
                                ensureAppendixUrls(app, dName);
                            });
                        }

                        AviationDB.setLoadedPackage(pkg);
                        setDocData(pkg);
                        const count = Object.keys(pkg.articles || {}).length;
                        setDataCount(count);
                        setAppendixCount(Object.keys(pkg.appendices || {}).length);
                        const allIds = AviationDB.getAllIds();
                        if (allIds.length > 0) setSingleId(allIds[0]);

                        const newCache = { ...translatedCache };
                        Object.values(pkg.articles).forEach(art => {
                            if (art.translations) {
                                Object.keys(art.translations).forEach(lCode => {
                                    newCache[`${docId}_art_${art.id}_${lCode}`] = art.translations[lCode];
                                });
                            }
                            if (art.translatedText) {
                                newCache[`${docId}_art_${art.id}_en`] = art.translatedText;
                                newCache[`${docId}_art_${art.id}_vi`] = art.translatedText;
                                newCache[`${docId}_art_${art.id}`] = art.translatedText;
                            }
                        });
                        setTranslatedCache(newCache);
                    } else if (pkg.pdfUrl) {
                        AviationDB.setLoadedPackage(null);
                        setDocData(pkg);
                        setDataCount(0);
                        setAppendixCount(0);
                    }
                } else {
                    AviationDB.setLoadedPackage(null);
                    setDocData(null);
                    setDataCount(0);
                    setAppendixCount(0);
                }
            };

            // HÀM CHUYỂN TAB AN TOÀN - ĐỒNG BỘ DỮ LIỆU & BẢO TOÀN TRẠNG THÁI
            const switchDoc = async (nextDocId) => {
                if (nextDocId === activeDocId) return;

                // Lưu trạng thái của tài liệu hiện tại
                const currentNavSnapshot = {
                    tab,
                    singleId,
                    singleAppendixKey,
                    page,
                    search,
                    appendixSearch,
                    partFilter,
                    chapterFilter,
                    jumpHistory
                };

                const updatedNavStates = {
                    ...docNavStates,
                    [activeDocId]: currentNavSnapshot
                };
                setDocNavStates(updatedNavStates);

                // Nạp dữ liệu tài liệu đích
                await loadDocData(nextDocId);

                // Khôi phục trạng thái an toàn, tránh filter cũ làm trống danh sách
                const savedState = updatedNavStates[nextDocId];
                const targetPkg = GLOBAL_DOCS_STORE[nextDocId];
                const validParts = (targetPkg?.parts || []).map(p => String(p.id));

                if (savedState) {
                    setTab(savedState.tab || 'all');
                    
                    if (savedState.singleId && targetPkg?.articles && targetPkg.articles[savedState.singleId]) {
                        setSingleId(savedState.singleId);
                    } else {
                        const allIds = targetPkg?.articles ? Object.keys(targetPkg.articles).sort(naturalCompareSectionCodes) : [];
                        if (allIds.length > 0) setSingleId(allIds[0]);
                    }

                    if (savedState.singleAppendixKey) setSingleAppendixKey(savedState.singleAppendixKey);
                    if (savedState.page) setPage(savedState.page);
                    setSearch(savedState.search || '');
                    setAppendixSearch(savedState.appendixSearch || '');

                    // Chỉ phục hồi partFilter nếu thuộc tài liệu này
                    if (savedState.partFilter && validParts.includes(String(savedState.partFilter))) {
                        setPartFilter(savedState.partFilter);
                    } else {
                        setPartFilter('all');
                    }
                    
                    setChapterFilter('all'); // Luôn reset chapter filter khi chuyển tab để tránh lệch
                    setJumpHistory(savedState.jumpHistory || null);
                } else {
                    setTab('all');
                    setPartFilter('all');
                    setChapterFilter('all');
                    setSearch('');
                    setPage(1);
                    setJumpHistory(null);
                }
            };

            const closeDoc = async (docId) => {
                if (docId === 'main') {
                    notify("Không thể đóng tài liệu chính!");
                    return;
                }
                const updatedDocs = docs.filter(d => d.id !== docId);
                setDocs(updatedDocs);
                await WorkspaceDB.put('docs_meta', updatedDocs);
                if (activeDocId === docId) {
                    const fallbackId = updatedDocs[0]?.id || 'main';
                    await switchDoc(fallbackId);
                }
                await refreshStoredRegistry();
                notify("Đã đóng tab tài liệu.");
            };

            const openUploadMenu = async () => {
                await refreshStoredRegistry();
                setUploadMenuModal(true);
            };

            const openResetMenu = async () => {
                await refreshStoredRegistry();
                setResetModal(true);
            };

            const deleteSpecificDoc = async (docId, docName) => {
                if (docId === 'main') {
                    alert("Không thể xóa tài liệu chính!");
                    return;
                }
                if (!confirm(`Bạn có chắc chắn muốn XÓA VĨNH VIỄN tài liệu "${docName}" khỏi CSDL?`)) return;

                delete GLOBAL_DOCS_STORE[docId];
                await WorkspaceDB.remove(docId);
                const updatedDocs = docs.filter(d => d.id !== docId);
                setDocs(updatedDocs);
                await WorkspaceDB.put('docs_meta', updatedDocs);

                setSavedRegistry(prev => prev.filter(r => r.id !== docId));

                if (activeDocId === docId) {
                    const fallbackId = updatedDocs[0]?.id || 'main';
                    await switchDoc(fallbackId);
                }
                
                await refreshStoredRegistry();
                notify(`✅ Đã xóa "${docName}"! Bạn có thể nạp lại file ngay.`);
            };

            const clearAllDatabase = async () => {
                if (!confirm("⚠️ CẢNH BÁO: XÓA SẠCH toàn bộ CSDL IndexedDB trên máy của bạn?")) return;

                await WorkspaceDB.clearAll();
                setOnlineWorkspaceData(null);
                const defaultDocs = [{ id: 'main', name: 'Bộ Quy Chế (Chính)', type: 'docx' }];
                setDocs(defaultDocs);
                setActiveDocId('main');
                setDocData(null);
                AviationDB.setLoadedPackage(null);
                setDataCount(0);
                setAppendixCount(0);
                setSavedRegistry([]);
                setResetModal(false);
                notify("✅ Đã xóa toàn bộ CSDL IndexedDB!");

            const handleRenameDocument = async (docId, currentName) => {
                const newName = prompt("Nhập tên hiển thị mới cho tài liệu:", currentName || "");
                if (!newName || !newName.trim() || newName.trim() === currentName) return;

                const cleanNewName = newName.trim();
                const updatedDocs = docs.map(d => d.id === docId ? { ...d, name: cleanNewName } : d);
                setDocs(updatedDocs);
                await WorkspaceDB.put('docs_meta', updatedDocs);

                let pkg = GLOBAL_DOCS_STORE[docId] || await WorkspaceDB.get(docId);
                if (pkg) {

                        setDocData({ ...pkg });
                    }
                }
                await refreshStoredRegistry();
                notify("✅ Đã đổi tên tài liệu thành công!");

            const isEnglishDoc = useMemo(() => {
                if (!docData || !docData.articles) return false;
                const sampleTexts = Object.values(docData.articles).slice(0, 8).map(a => `${a.title} ${a.plainText}`).join(' ');
                const vietnamesePattern = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđĐ]/i;
                return !vietnamesePattern.test(sampleTexts);
            }, [docData, activeDocId]);

            const handleDownloadOfflineData = async () => {
                try {
                    notify("⏳ Đang lưu dữ liệu vào bộ nhớ trình duyệt để chạy Offline...");

                    let packageMeta = docs;
                    let packageData = {};

                    for (const d of docs) {
                        let pkg = GLOBAL_DOCS_STORE[d.id] || (d.id === activeDocId ? docData : await WorkspaceDB.get(d.id));
                        if (pkg) packageData[d.id] = pkg;
                    }

                    if (Object.keys(packageData).length === 0) {
                        alert("⚠️ Không tìm thấy nguồn dữ liệu để lưu offline!");
                        return;
                    }

                    await WorkspaceDB.put('docs_meta', packageMeta);
                    for (const docKey of Object.keys(packageData)) {
                        await WorkspaceDB.put(docKey, packageData[docKey]);
                    }

                    setDocs(packageMeta);
                    await refreshStoredRegistry();
                    await loadDocData(activeDocId || packageMeta[0]?.id || 'main');

                    alert("🎉 Tải data thành công!\n\nToàn bộ quy chế và phụ lục PDF/Word đã được lưu vào bộ nhớ trình duyệt. Bạn có thể ngắt mạng mà vẫn mở tra cứu bình thường!");
                } catch (err) {
                    alert("❌ Lỗi khi tải dữ liệu offline: " + err.message);
                }
            };

            const handleSaveAppendixAiDataModal = async () => {
                let pkg = GLOBAL_DOCS_STORE[activeDocId] || await WorkspaceDB.get(activeDocId) || AviationDB.getRawPackage();
                pkg.appendixAiData = (appendixAiModal.editContent || '').trim();

                GLOBAL_DOCS_STORE[activeDocId] = pkg;
                await WorkspaceDB.put(activeDocId, pkg);
                setDocData({ ...pkg });
                setAppendixAiModal(prev => ({ ...prev, isEditing: false }));
                notify("✅ Đã lưu cập nhật CSDL Phụ lục!");
