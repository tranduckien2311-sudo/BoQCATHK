            const executeFastTranslation = async (targetLangCode, targetLangName, targetArticle = null) => {
                setLangSelectModal({ isOpen: false, mode: 'all', article: null });

                let pkg = GLOBAL_DOCS_STORE[activeDocId] || (activeDocId && docData) ? docData : await WorkspaceDB.get(activeDocId);
                if (!pkg || !pkg.articles || Object.keys(pkg.articles).length === 0) {
                    notify("⚠️ Tài liệu không có nội dung điều khoản để dịch!");
                    return;
                }

                const docIsEnglish = isEnglishDoc;
                const defaultDocLang = docIsEnglish ? 'en' : 'vi';

                if (targetLangCode === defaultDocLang) {
                    if (targetArticle) {
                        setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${targetArticle.id}`]: 'original' }));
                        notify(`🇻🇳 Đã chuyển mục ${targetArticle.code || targetArticle.id} về ngôn ngữ gốc!`);
                    } else {
                        handleResetAllToOriginal();
                    }
                    return;
                }

                const articlesList = targetArticle ? [pkg.articles[targetArticle.id] || targetArticle] : Object.values(pkg.articles);
                const updatedCache = { ...translatedCache };
                const pendingArticles = [];

                articlesList.forEach(art => {
                    const cacheKey = `${activeDocId}_art_${art.id}_${targetLangCode}`;
                    const legacyKey = `${activeDocId}_art_${art.id}`;

                    const existingTranslation = 
                        (art.translations && art.translations[targetLangCode]) ||
                        updatedCache[cacheKey] ||
                        translatedCache[cacheKey] ||
                        (art.translatedText && (targetLangCode === 'en' || targetLangCode === (docIsEnglish ? 'vi' : 'en')) ? art.translatedText : null) ||
                        translatedCache[legacyKey];

                    if (!art.plainText || !art.plainText.trim()) {
                        if (!art.translations) art.translations = {};
                        art.translations[targetLangCode] = art.title || '';
                        updatedCache[cacheKey] = art.title || '';
                    } else if (existingTranslation) {
                        if (!art.translations) art.translations = {};
                        art.translations[targetLangCode] = existingTranslation;
                        updatedCache[cacheKey] = existingTranslation;
                    } else {
                        pendingArticles.push(art);
                    }
                });

                if (pendingArticles.length === 0) {
                    setTranslatedCache(updatedCache);

                    if (targetArticle) {
                        setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${targetArticle.id}`]: targetLangCode }));
                        notify(`✅ Đã chuyển mục sang ${targetLangName}!`);
                    } else {
                        setGlobalLangMode(prev => ({ ...prev, [activeDocId]: targetLangCode }));
                        const updatedViewModes = { ...articleViewModes };
                        Object.values(pkg.articles).forEach(art => {
                            updatedViewModes[`${activeDocId}_art_${art.id}`] = targetLangCode;
                        });
                        setArticleViewModes(updatedViewModes);
                        notify(`✅ Đã chuyển toàn bộ sang ${targetLangName}!`);
                    }
                    return;
                }

                batchTranslateAbortRef.current = false;
                batchTranslatePauseRef.current = false;

                if (!targetArticle && pendingArticles.length > 1) {
                    setBatchTranslateModal({
                        isOpen: true,
                        isRunning: true,
                        isPaused: false,
                        current: 0,
                        total: pendingArticles.length,
                        docId: activeDocId,
                        docName: activeDocName,
                        targetLangName: targetLangName
                    });
                }

                let completed = 0;
                for (let i = 0; i < pendingArticles.length; i++) {
                    if (batchTranslateAbortRef.current) break;
                    while (batchTranslatePauseRef.current) {
                        await new Promise(r => setTimeout(r, 300));
                        if (batchTranslateAbortRef.current) break;
                    }
                    if (batchTranslateAbortRef.current) break;

                    const art = pendingArticles[i];
                    const cacheKey = `${activeDocId}_art_${art.id}_${targetLangCode}`;

                    try {
                        const fullText = `${art.title}\n\n${art.plainText}`.trim();
                        if (!fullText) {
                            if (!art.translations) art.translations = {};
                            art.translations[targetLangCode] = art.title || '';
                            updatedCache[cacheKey] = art.title || '';
                        } else {
                            const translated = await quickGoogleTranslate(fullText, targetLangCode, 'auto');
                            const finalTrans = translated || fullText;
                            if (!art.translations) art.translations = {};
                            art.translations[targetLangCode] = finalTrans;
                            if (targetLangCode === 'en' || targetLangCode === 'vi') {
                                art.translatedText = finalTrans;
                            }
                            updatedCache[cacheKey] = finalTrans;
                        }
                    } catch (err) {
                        console.error(`Lỗi dịch mục ${art.code || art.id}:`, err);
                        if (!art.translations) art.translations = {};
                        art.translations[targetLangCode] = art.plainText;
                        updatedCache[cacheKey] = art.plainText;
                    }

                    completed++;
                    if (!targetArticle && pendingArticles.length > 1) {
                        setBatchTranslateModal(prev => ({ ...prev, current: completed }));
                    }

                    if (completed % 5 === 0 || completed === pendingArticles.length) {
                        GLOBAL_DOCS_STORE[activeDocId] = pkg;
                        await WorkspaceDB.put(activeDocId, pkg);
                    }
                }

                GLOBAL_DOCS_STORE[activeDocId] = pkg;
                await WorkspaceDB.put(activeDocId, pkg);
                AviationDB.setLoadedPackage(pkg);
                setDocData({ ...pkg });
                setTranslatedCache(updatedCache);

                if (targetArticle) {
                    setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${targetArticle.id}`]: targetLangCode }));
                    notify(`✅ Đã dịch mục sang ${targetLangName}!`);
                } else {
                    setGlobalLangMode(prev => ({ ...prev, [activeDocId]: targetLangCode }));
                    const updatedViewModes = { ...articleViewModes };
                    Object.values(pkg.articles).forEach(art => {
                        updatedViewModes[`${activeDocId}_art_${art.id}`] = targetLangCode;
                    });
                    setArticleViewModes(updatedViewModes);
                    setBatchTranslateModal(prev => ({ ...prev, isRunning: false }));
                    notify(`🎉 Đã dịch xong và chuyển sang ${targetLangName}!`);
                }
            };

            const handleResetAllToOriginal = () => {
                setGlobalLangMode(prev => ({ ...prev, [activeDocId]: 'original' }));
                const updatedViewModes = { ...articleViewModes };
                if (docData && docData.articles) {
                    Object.values(docData.articles).forEach(art => {
                        updatedViewModes[`${activeDocId}_art_${art.id}`] = 'original';
                    });
                }
                setArticleViewModes(updatedViewModes);
                notify("🇻🇳 Đã chuyển toàn bộ các điều về văn bản gốc!");
            };

            const handleResetSingleArticleToOriginal = (art) => {
                if (!art) return;
                setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${art.id}`]: 'original' }));
                notify(`🇻🇳 Đã chuyển mục ${art.code || art.id} về bản gốc!`);
            };

            const getArticleDisplayText = (art) => {
                if (!art) return '';
                const artMode = articleViewModes[`${activeDocId}_art_${art.id}`] || globalLangMode[activeDocId] || 'original';
                if (artMode === 'original') {
                    return art.plainText || '';
                }
                const targetLang = artMode;
                const cacheKey = `${activeDocId}_art_${art.id}_${targetLang}`;
                const legacyKey = `${activeDocId}_art_${art.id}`;
                return (
                    (art.translations && art.translations[targetLang]) ||
                    translatedCache[cacheKey] ||
                    (targetLang === 'en' && art.translatedText) ||
                    (targetLang === 'vi' && art.translatedText) ||
                    translatedCache[legacyKey] ||
                    art.plainText || ''
                );
            };

            const handleHyperlinkJump = async ({ code, isAppendix, raw }) => {
                if (!code) return;
                const cleanCode = code.trim();
                const currentApps = AviationDB.getAppendicesMap() || {};
                const currentArts = AviationDB.getArticlesMap() || {};

                const summaries = [];
                for (const d of docs) {
                    let p = GLOBAL_DOCS_STORE[d.id] || ((d.id === activeDocId && docData) ? docData : await WorkspaceDB.get(d.id));

                    let matchFound = null;
                    let matchType = '';

                    if (p && p.articles) {
                        const artMatch = Object.values(p.articles).find(a => 
                            String(a.id).trim().toLowerCase() === cleanCode.toLowerCase() ||
                            (a.code && a.code.toLowerCase().replace(/^(?:điều|mục|section)\s*/i, '').trim() === cleanCode.toLowerCase()) ||
                            (a.code && a.code.toLowerCase() === cleanCode.toLowerCase())
                        );
                        if (artMatch) {
                            matchFound = artMatch;
                            matchType = 'article';
                        }
                    }

                    if (!matchFound && p && p.appendices) {
                        const appMatch = Object.values(p.appendices).find(app => 
                            String(app.id).toLowerCase() === cleanCode.toLowerCase() ||
                            String(app.code || '').toLowerCase() === cleanCode.toLowerCase() ||
                            (app.code && app.code.toLowerCase().replace(/^(?:phụ lục|appendix|mẫu|mau)\s*/i, '').trim() === cleanCode.toLowerCase())
                        );
                        if (appMatch) {
                            matchFound = appMatch;
                            matchType = 'appendix';
                        }
                    }

                    summaries.push({
                        docId: d.id,
                        docName: d.name,
                        docType: d.type || 'docx',
                        hasMatch: Boolean(matchFound),
                        matchType: matchType,
                        matchItem: matchFound
                    });
                }

                setSelectorModal({
                    isOpen: true,
                    code: cleanCode,
                    raw: raw || code,
                    isAppendix: isAppendix,
                    fromTab: tab,
                    fromId: tab === 'appendices' ? singleAppendixKey : singleId,
                    fromDocId: activeDocId,
                    fromDocName: activeDocName,
                    fromLabel: tab === 'appendices' ? (currentApps[singleAppendixKey]?.title || 'Phụ lục') : (currentArts[singleId]?.code || `Mục ${singleId}`),
                    docSummaries: summaries
                });
            };

            const handleSelectDocumentToOpen = async (summaryItem) => {
                const targetDocId = summaryItem.docId;
                const { code, fromTab, fromId, fromDocId, fromDocName, fromLabel } = selectorModal;
                setSelectorModal(prev => ({ ...prev, isOpen: false }));

                if (targetDocId !== activeDocId) {
                    await switchDoc(targetDocId);

                if (summaryItem.hasMatch && summaryItem.matchItem) {
                    if (summaryItem.matchType === 'appendix') {
                        setJumpHistory({
                            targetDocId: targetDocId,
                            targetId: summaryItem.matchItem.id,
                            targetType: 'appendices',
                            fromDocId: fromDocId,
                            fromDocName: fromDocName,
                            fromTab: fromTab,
                            fromId: fromId,
                            fromLabel: fromLabel
                        });
                        setSingleAppendixKey(summaryItem.matchItem.id);
                        setTab('appendices');
                        notify(`📍 Đã mở [${summaryItem.matchItem.title}] trong "${summaryItem.docName}"`);
                        return;
                    } else {
                        setJumpHistory({
                            targetDocId: targetDocId,
                            targetId: summaryItem.matchItem.id,
                            targetType: 'single',
                            fromDocId: fromDocId,
                            fromDocName: fromDocName,
                            fromTab: fromTab,

                            fromLabel: fromLabel
                        });
                        setSingleId(summaryItem.matchItem.id);

            const handleDirectJumpFromAi = async (ref) => {

                    const targetDocName = ref.docName || activeDocName;

                    if (targetDocId !== activeDocId) {

            const handleGoBackJump = async () => {
                if (!jumpHistory) return;
                const prev = jumpHistory;
                setJumpHistory(null);

                if (prev.fromDocId && prev.fromDocId !== activeDocId) {
                    await switchDoc(prev.fromDocId);
                }

                if (prev.fromTab === 'appendices') {
                    setSingleAppendixKey(prev.fromId);
                    setTab('appendices');
                } else if (prev.fromTab === 'single') {
                    setSingleId(prev.fromId);
                    setTab('single');
                } else {
                    setTab(prev.fromTab || 'all');
                }
                notify(`↩️ Đã quay về: ${prev.fromLabel} (${prev.fromDocName})`);

            const saveApiKey = (key) => {
                const clean = (key || '').trim();
                setAiApiKey(clean);

                notify("✅ Đã lưu Gemini API Key!");

            const scanAvailableModels = async () => {
                const cleanKey = (tempApiKey || aiApiKey || '').trim();
                if (!cleanKey) {
                    notify("⚠️ Vui lòng nhập API Key trước khi quét model!");
                    return;
                }
                setIsScanningModels(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);

                const isND223 = normName.includes('223');
                const isBoQC = !isND221 && !isND223;

                const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                const appendicesMap = {};
                const seenKeys = new Set();
                let count = 0;

                const boqcAppRegex = new RegExp(`^(?:PHỤ\\s*LỤC|PHU\\s*LUC|APPENDIX|ATTACHMENT)[\\s\\.\\:\\-]*(${ROMAN_STRICT_PATTERN})?(?:[\\.\\:\\-\\–\\—\\s\\t]+(.*))?$`, 'i');
                const generalAppRegex = new RegExp(`^(?:PHỤ\\s*LỤC|PHU\\s*LUC|APPENDIX|ATTACHMENT|MẪU\\s*SỐ|MAU\\s*SO|MẪU|MAU)[\\s\\.\\:\\-]*(${STRICT_CODE_PATTERN})?(?:[\\.\\:\\-\\–\\—\\s\\t]+(.*))?$`, 'i');

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (line.length > 220) continue;

                    let isMau = false;
                    let rawCode = '';
                    let rawTitle = '';

                    if (isBoQC) {
                        const match = line.match(boqcAppRegex);
                        if (!match) continue;
                        rawCode = match[1] ? match[1].trim() : '';
                        rawTitle = match[2] ? match[2].trim() : '';
                    } else {
                        const match = line.match(generalAppRegex);
                        if (!match) continue;
                        isMau = /^(?:MẪU|MAU)/i.test(line);
                        rawCode = match[1] ? match[1].trim() : '';
                        rawTitle = match[2] ? match[2].trim() : '';
                    }

                    let cleanCode = rawCode.replace(/^(?:phụ\s*lục|phu\s*luc|mẫu\s*số|mau\s*so|mẫu|mau|appendix|pl)\s*/i, '').trim();
                    let dedupeKey = '';
                    let typePrefix = isMau ? 'Mẫu' : 'Phụ lục';

                    if (isBoQC) {
                        let dec = romanToDecimal(cleanCode);
                        if (dec <= 0 || dec > 63) continue;
                        cleanCode = ROMAN_NUMERALS[dec - 1];
                        dedupeKey = `BOQC_PL_${dec}`;
                        typePrefix = 'Phụ lục';
                    } else if (isND221) {
                        if (isMau) {
                            let mNum = parseInt(cleanCode, 10);
                            if (isNaN(mNum) || mNum < 1 || mNum > 11) continue;
                            cleanCode = String(mNum).padStart(2, '0');
                            dedupeKey = `ND221_MAU_${cleanCode}`;
                        } else {
                            let dec = romanToDecimal(cleanCode);
                            if (dec <= 0 || dec > 8) continue;
                            cleanCode = ROMAN_NUMERALS[dec - 1];
                            dedupeKey = `ND221_PL_${cleanCode}`;
                        }
                    } else if (isND223) {
                        let mNum = parseInt(cleanCode, 10);
                        if (isNaN(mNum) || mNum < 1 || mNum > 27) continue;
                        cleanCode = String(mNum).padStart(2, '0');
                        dedupeKey = `ND223_MAU_${cleanCode}`;
                        typePrefix = 'Mẫu';
                    } else {
                        dedupeKey = `${typePrefix}_${cleanCode || ++count}`;
                    }

                    if (seenKeys.has(dedupeKey)) continue;
                    seenKeys.add(dedupeKey);

                    if (!rawTitle || rawTitle.length < 4) {
                        for (let k = i + 1; k < Math.min(lines.length, i + 6); k++) {
                            const nextL = lines[k].trim();
                            if (!nextL || isSkippableAppendixLine(nextL)) continue;
                            if (generalAppRegex.test(nextL) || /^(?:ĐIỀU|Điều|DIEU|CHƯƠNG|PHẦN)\s+/i.test(nextL)) break;
                            if (nextL.length >= 4 && nextL.length < 220) {
                                rawTitle = nextL;
                                break;
                            }
                        }
                    }

                    let cleanTitle = rawTitle.replace(new RegExp(`^(?:${typePrefix}|phụ\\s*lục|mẫu\\s*số|mẫu|appendix)\\s*${cleanCode}\\s*[-–—:]?\\s*`, 'i'), '').trim();
                    let fullTitle = cleanTitle ? `${typePrefix} ${cleanCode} - ${cleanTitle}` : `${typePrefix} ${cleanCode}`;

                    const itemKey = `app_${dedupeKey}`;
                    appendicesMap[itemKey] = {
                        id: itemKey,
                        code: cleanCode,
                        title: fullTitle,
                        plainText: "",
                        pdfFileName: "",
                        pdfFileUrl: "",
                        wordFileName: "",
                        wordFileUrl: ""
                    };
                    ensureAppendixUrls(appendicesMap[itemKey], docName);
                }

                if (isBoQC) {
                    for (let i = 1; i <= 63; i++) {
                        const rom = ROMAN_NUMERALS[i - 1];
                        const key = `BOQC_PL_${i}`;
                        const itemKey = `app_${key}`;
                        if (!appendicesMap[itemKey]) {
                            appendicesMap[itemKey] = {
                                id: itemKey,
                                code: rom,
                                title: `Phụ lục ${rom}`,
                                plainText: "",
                                pdfFileName: "",
                                pdfFileUrl: "",
                                wordFileName: "",
                                wordFileUrl: ""
                            };
                            ensureAppendixUrls(appendicesMap[itemKey], docName);
                        }
                    }
                }

                return appendicesMap;
            };

            const processWordFileForDocx = (arrayBuffer, isMainDoc, targetDocId, newName, keepExistingAppendices = false, selectedMode = 'came') => {
                setImporting(true);
                notify(`⏳ Đang bóc tách theo chế độ [${selectedMode.toUpperCase()}]: ${newName}...`);

                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(async function(result) {
                        let rawText = (result.value || '').normalize('NFC');
                        const allLines = rawText.split(/\r?\n/)
                            .map(l => l.replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\u00A0/g, ' ').trim())
                            .filter(l => l.length > 0);

                        const normName = newName.toLowerCase();
                        const isND221 = normName.includes('221') || targetDocId.includes('221');
                        const isND223 = normName.includes('223') || targetDocId.includes('223');
                        const isManual = /(?:came|moe|mme|manual|smm|om|sop|handbook|iosa|ism)/i.test(normName);
                        const isBoQC = (normName.includes('boqc') || normName.includes('quy chế') || (targetDocId === 'main' && !isManual)) && !isND221 && !isND223;

                        let mode = selectedMode;
                        if (!mode || mode === 'auto') {
                            let hasVnArticles = allLines.slice(0, 150).some(l => /^\s*(?:ĐIỀU|Điều|Ðiều|DIEU|Dieu)\s+\d+/i.test(l));
                            if (hasVnArticles || isBoQC || isND221 || isND223) mode = 'law';
                            else if (normName.includes('iosa') || normName.includes('ism')) mode = 'iosa';
                            else mode = 'came';
                        }

                        const partRegex = new RegExp(`^\\s*(?:PHẦN|PHAN|PART|SECTION)[\\s\\.\\:\\-]*(${ROMAN_STRICT_PATTERN})[\\.\\:\\-\\–\\—\\s]*(.*)$`, 'i');
                        const chapRegex = /^\s*(?:CHƯƠNG|CHUONG|CHAPTER)\s+([0-9]+|[IVXLCDM]+)\b(?!\.)[\.\:\-\–\—\\s]*(.*)$/i;
                        const vnArtRegex = /^\s*(?:ĐIỀU|Điều|Ðiều|Điều|DIEU|Dieu)\s*[\.\:\-]?\s*(\d+[a-zA-Z]?(?:\.\d+)*)(?:[\.\:\-\–\—\s\t]+(.*))?$/i;
                        
                        const unitBlacklist = /^(?:hours?|fh|fc|flight\s+hours?|cycles?|days?|months?|years?|weeks?|mins?|minutes?|secs?|seconds?|kg|lbs?|mm|cm|inches?|in|ft|feet|meters?|m|psi|bar|volts?|v|amp|amps?|knots?|kts?|nm|percent|%|deg|°c|°f|ea|times?)\b/i;
                        const level2HeadingRegex = /^\s*(?:(?:SECTION|ARTICLE|CLAUSE|ITEM|MỤC)\s+)?([1-9]\d*\.\d+)(?!\.\d+)(?:[\.\:\-\–\—\s\t]+(.*))?$/i;
                        const level3HeadingRegex = /^\s*(?:(?:SECTION|ARTICLE|CLAUSE|ITEM|MỤC)\s+)?((?:(?:ORG|FLT|DSP|MNT|CAB|GRH|CGO|SEC|ISM)\s+)?[1-9]\d*\.\d+\.\d+(?:\.\d+)*)(?:[\.\:\-\–\—\s\t]+(.*))?$/i;
                        const tableHeadingRegex = /^\s*(?:TABLE|Table|BẢNG|Bảng)\s*([1-9]\d*(?:\.\d+)+)(?:[\.\:\-\–\—\s\t]+(.*))?$/i;
                        const boqcAppRegex = /^\s*(?:PHỤ\s*LỤC|PHU\s*LUC|APPENDIX|ATTACHMENT|PL)\s*([0-9A-Za-zIVXLCDM\.\_\-]+)?(?:[\.\:\-\–\—\s\t]+(.*))?$/i;

                        let currentPart = (mode === 'law') ? "Phần chung" : "PART 1";
                        let currentChapter = (mode === 'law') ? "" : "Section 1.1";
                        const rawPositions = [];
                        const appendixPositions = [];
                        const seenAppKeys = new Set();
                        const knownPartsMap = {};

                        const normalizePartName = (rawPNum, rawPName) => {
                            let dec = romanToDecimal(rawPNum);
                            let cleanNum = dec > 0 ? String(dec) : String(rawPNum).replace(/\D+/g, '') || '1';
                            let cleanTitle = (rawPName || '').replace(/^[\.\:\-\–\—\s\d]+/, '').trim();
                            cleanTitle = cleanTitle.replace(/^[-–—\s\d]+\s*/, '').trim();
                            return cleanTitle ? `PART ${cleanNum} - ${cleanTitle}` : `PART ${cleanNum}`;
                        };

                        for (let i = 0; i < allLines.length; i++) {
                            const line = allLines[i];
                            if (!line || /\d{1,2}\/\d{1,2}\/\d{2,4}/.test(line)) continue;

                            const tMatch = line.match(tableHeadingRegex);
                            if (tMatch) {
                                let tableNum = tMatch[1].trim();
                                let rawTitle = (tMatch[2] || '').trim().replace(/\s+\d{1,4}$/, '').trim();
                                
                                if (!rawTitle && i + 1 < allLines.length) {
                                    const nextL = allLines[i + 1].trim();
                                    if (!tableHeadingRegex.test(nextL) && !level3HeadingRegex.test(nextL) && !level2HeadingRegex.test(nextL) && nextL.length < 160) {
                                        rawTitle = nextL;
                                    }
                                }

                                const tableCode = `Table ${tableNum}`;
                                const fullTitle = rawTitle ? `${tableCode} - ${rawTitle}` : tableCode;
                                const partNum = tableNum.split('.')[0];
                                
                                currentPart = `TABLES (PART ${partNum})`;
                                currentChapter = tableCode;

                                rawPositions.push({
                                    num: tableCode,
                                    code: tableCode,
                                    title: fullTitle,
                                    chapter: currentChapter,
                                    part: currentPart,
                                    index: i
                                });
                                continue;
                            }

                            if (mode === 'law') {
                                const vMatch = line.match(vnArtRegex);
                                if (vMatch) {
                                    const num = vMatch[1].trim();
                                    let rawTitle = (vMatch[2] || '').trim().replace(/^[\.\:\-\–\—\s]+/, '').trim();
                                    if (!rawTitle && i + 1 < allLines.length) {
                                        const nextL = allLines[i + 1].trim();
                                        if (!vnArtRegex.test(nextL) && !partRegex.test(nextL) && !chapRegex.test(nextL) && nextL.length < 160) {
                                            rawTitle = nextL;
                                        }
                                    }

                                    rawPositions.push({
                                        num: num, 
                                        code: `Điều ${num}`, 
                                        title: rawTitle ? `Điều ${num}. ${rawTitle}` : `Điều ${num}`,
                                        chapter: currentChapter, 
                                        part: currentPart, 
                                        index: i
                                    });
                                    continue;
                                }
                            } else if (mode === 'iosa') {
                                const l3Match = line.match(level3HeadingRegex);
                                const l2Match = line.match(level2HeadingRegex);

                                if (l3Match) {
                                    let code = l3Match[1].trim();
                                    let rawTitle = (l3Match[2] || '').trim().replace(/\s+\d{1,4}$/, '').trim();

                                    if (!rawTitle && i + 1 < allLines.length) {
                                        const nextL = allLines[i + 1].trim();
                                        if (!level3HeadingRegex.test(nextL) && !level2HeadingRegex.test(nextL) && !partRegex.test(nextL) && nextL.length < 160) {
                                            rawTitle = nextL;
                                        }
                                    }

                                    if (!unitBlacklist.test(rawTitle)) {
                                        let fullTitle = rawTitle ? (rawTitle.startsWith(code) ? rawTitle : `${code} ${rawTitle}`) : code;
                                        const cleanNumOnly = code.replace(/^[A-Z]+\s+/i, '');
                                        const disciplineMatch = code.match(/^[A-Z]+/i);
                                        const discipline = disciplineMatch ? disciplineMatch[0].toUpperCase() : '';

                                        const partNum = cleanNumOnly.split('.')[0];
                                        const chapPrefix = cleanNumOnly.split('.').slice(0, 2).join('.');
                                        
                                        currentPart = discipline ? `${discipline} (Part ${partNum})` : (knownPartsMap[partNum] || `PART ${partNum}`);
                                        currentChapter = discipline ? `${discipline} Section ${chapPrefix}` : `Section ${chapPrefix}`;

                                        rawPositions.push({
                                            num: code,
                                            code: code,
                                            title: fullTitle,
                                            chapter: currentChapter,
                                            part: currentPart,
                                            index: i
                                        });
                                        continue;
                                    }
                                } else if (l2Match) {
                                    let code = l2Match[1].trim();
                                    let rawTitle = (l2Match[2] || '').trim().replace(/\s+\d{1,4}$/, '').trim();
                                    if (!unitBlacklist.test(rawTitle)) {
                                        currentChapter = `Section ${code} - ${rawTitle}`;
                                    }
                                }
                            } else {
                                const mMatch = line.match(level2HeadingRegex);
                                if (mMatch) {
                                    let code = mMatch[1].trim();
                                    let rawTitle = (mMatch[2] || '').trim().replace(/\s+\d{1,4}$/, '').trim();

                                    if (!rawTitle && i + 1 < allLines.length) {
                                        const nextL = allLines[i + 1].trim();
                                        if (!level2HeadingRegex.test(nextL) && !partRegex.test(nextL) && !chapRegex.test(nextL) && nextL.length < 160) {
                                            rawTitle = nextL;
                                        }
                                    }

                                    if (!unitBlacklist.test(rawTitle)) {
                                        const isCapitalized = /^[A-ZÀ-Ỹ]/.test(rawTitle);
                                        const letterCount = (rawTitle.match(/[a-zA-ZÀ-ỹ]/g) || []).length;

                                        if (isCapitalized && letterCount >= 3) {
                                            let fullTitle = rawTitle.startsWith(code) ? rawTitle : `${code} ${rawTitle}`;
                                            const partNumFromCode = code.split('.')[0];
                                            currentPart = knownPartsMap[partNumFromCode] || `PART ${partNumFromCode}`;
                                            currentChapter = `Section ${code} - ${rawTitle}`;

                                            rawPositions.push({
                                                num: code,
                                                code: code,
                                                title: fullTitle,
                                                chapter: currentChapter,
                                                part: currentPart,
                                                index: i
                                            });
                                            continue;
                                        }
                                    }
                                }
                            }

                            const pMatch = line.match(partRegex);
                            if (pMatch && line.length < 180 && !isSkippableAppendixLine(line)) {
                                let rawPartNum = pMatch[1].trim();
                                let dec = romanToDecimal(rawPartNum);
                                let cleanNum = dec > 0 ? String(dec) : rawPartNum;
                                let partName = (pMatch[2] || '').trim();

                                if (!partName && i + 1 < allLines.length) {
                                    const nextL = allLines[i + 1].trim();
                                    if (!chapRegex.test(nextL) && !vnArtRegex.test(nextL) && !partRegex.test(nextL) && !level2HeadingRegex.test(nextL) && nextL.length < 160) {
                                        partName = nextL;
                                    }
                                }

                                currentPart = normalizePartName(cleanNum, partName);
                                knownPartsMap[cleanNum] = currentPart;
                                if (dec > 0) knownPartsMap[String(dec)] = currentPart;
                                currentChapter = "";
                                continue;
                            }

                            const cMatch = line.match(chapRegex);
                            if (cMatch && line.length < 220 && !isSkippableAppendixLine(line)) {
                                let chapNum = cMatch[1].toUpperCase().trim();
                                let chapDec = romanToDecimal(chapNum);
                                let cleanChapNum = chapDec > 0 ? String(chapDec) : chapNum;
                                let chapName = (cMatch[2] || '').trim().replace(/^[\.\:\-\–\—\s]+/, '').trim();
                                currentChapter = chapName ? `Chương ${cleanChapNum} - ${chapName}` : `Chương ${cleanChapNum}`;
                                continue;
                            }

                            if (isSkippableAppendixLine(line)) continue;

                            if (isBoQC) {
                                const appMatch = line.match(boqcAppRegex);
                                if (appMatch && line.length < 180) {
                                    let rawAppCode = appMatch[1] ? appMatch[1].trim() : '';
                                    let dec = romanToDecimal(rawAppCode);
                                    if (dec >= 1 && dec <= 63) {
                                        const stdCode = ROMAN_NUMERALS[dec - 1];
                                        const key = `BOQC_PL_${dec}`;
                                        if (!seenAppKeys.has(key)) {
                                            seenAppKeys.add(key);
                                            let appTitle = appMatch[2] ? appMatch[2].trim() : '';
                                            let fullTitle = appTitle ? `Phụ lục ${stdCode} - ${appTitle}` : `Phụ lục ${stdCode}`;
                                            appendixPositions.push({ code: stdCode, title: fullTitle, index: i, dedupeKey: key });
                                        }
                                    }
                                }
                            }
                        }

                        const groupedByCode = {};
                        rawPositions.forEach(pos => {
                            if (!groupedByCode[pos.num]) groupedByCode[pos.num] = [];
                            groupedByCode[pos.num].push(pos);
                        });

                        const articlePositions = [];
                        Object.keys(groupedByCode).forEach(num => {
                            const candidates = groupedByCode[num];
                            articlePositions.push(candidates[candidates.length - 1]);
                        });

                        articlePositions.sort((a, b) => a.index - b.index);

                        if (isBoQC) {
                            for (let i = 1; i <= 63; i++) {
                                const rom = ROMAN_NUMERALS[i - 1];
                                const key = `BOQC_PL_${i}`;
                                if (!seenAppKeys.has(key)) {
                                    appendixPositions.push({ code: rom, title: `Phụ lục ${rom}`, index: allLines.length, dedupeKey: key });
                                }
                            }
                        }

                        appendixPositions.sort((a, b) => naturalCompareSectionCodes(a.code, b.code));

                        const parsedArticles = {};
                        const dynamicPartsMap = {};
                        const docPrefix = targetDocId;

                        const lastArtIdx = articlePositions.length > 0 ? articlePositions[articlePositions.length - 1].index : 0;
                        const validAppendixStart = appendixPositions.find(app => app.index > lastArtIdx && app.index < allLines.length);
                        const firstAppendixIndex = validAppendixStart ? validAppendixStart.index : allLines.length;

                        for (let i = 0; i < articlePositions.length; i++) {
                            const curr = articlePositions[i];
                            const startIdx = curr.index;
                            const nextPos = articlePositions[i + 1];
                            const endIdx = nextPos ? nextPos.index : firstAppendixIndex;

                            let sliceLines = allLines.slice(startIdx, endIdx);

                            while (sliceLines.length > 1) {
                                const lastL = sliceLines[sliceLines.length - 1].trim();
                                if (!lastL || /^(?:INTENTIONAL\s+BLANK\s+PAGE|INTENTIONALLY\s+LEFT\s+BLANK)$/i.test(lastL)) {
                                    sliceLines.pop();
                                } else {
                                    break;
                                }
                            }

                            const plainText = sliceLines.join('\n').trim();

                            let pTitle = curr.part || "PART 1";
                            let partNumValue = getPartSortValue(pTitle);
                            let pId = `${docPrefix}_part_${partNumValue}`;

                            if (!dynamicPartsMap[pId]) {
                                dynamicPartsMap[pId] = {
                                    id: pId,
                                    title: pTitle,
                                    start: curr.code,
                                    end: curr.code,
                                    count: 1
                                };
                            } else {
                                dynamicPartsMap[pId].end = curr.code;
                                dynamicPartsMap[pId].count = (dynamicPartsMap[pId].count || 0) + 1;
                                if (pTitle.length > dynamicPartsMap[pId].title.length && pTitle.includes(' - ')) {
                                    dynamicPartsMap[pId].title = pTitle;
                                }
                            }

                            parsedArticles[curr.num] = {
                                id: curr.num,
                                code: curr.code,
                                title: curr.title,
                                chapter: curr.chapter || "",
                                partTitle: dynamicPartsMap[pId].title,
                                partId: pId,
                                plainText: plainText || curr.title,
                                isVerbatim: true
                            };
                        }

                        if (Object.keys(parsedArticles).length === 0) {
                            parsedArticles["1.0"] = {
                                id: "1.0",
                                code: "1.0",
                                title: newName ? newName.replace(/\.docx$/i, '') : "Toàn văn tài liệu",
                                chapter: "Section 1.0",
                                partTitle: "PART 1",
                                partId: `${docPrefix}_part_1`,
                                plainText: allLines.join('\n'),
                                isVerbatim: true
                            };
                            dynamicPartsMap[`${docPrefix}_part_1`] = {
                                id: `${docPrefix}_part_1`,
                                title: "PART 1",
                                start: "1.0",
                                end: "1.0",
                                count: 1
                            };
                        }

                        const sortedPartsList = Object.values(dynamicPartsMap).sort((a, b) => getPartSortValue(a.title) - getPartSortValue(b.title));

                        const extractedAppendices = {};
                        for (let i = 0; i < appendixPositions.length; i++) {
                            const app = appendixPositions[i];
                            const appKey = `app_${app.dedupeKey || (i + 1)}`;
                            extractedAppendices[appKey] = {
                                id: appKey,
                                code: app.code,
                                title: app.title,
                                plainText: "",
                                pdfFileName: "",
                                pdfFileUrl: "",
                                wordFileName: "",
                                wordFileUrl: ""
                            };
                            ensureAppendixUrls(extractedAppendices[appKey], newName);
                        }

                        const rawAppendixText = appendixPositions.length > 0 ? allLines.slice(firstAppendixIndex).join('\n').trim() : "";

                        const fullPackage = {
                            name: newName,
                            importMode: mode,
                            articles: parsedArticles,
                            parts: sortedPartsList,
                            appendices: extractedAppendices,
                            appendixAiData: rawAppendixText
                        };

                        GLOBAL_DOCS_STORE[targetDocId] = fullPackage;
                        await WorkspaceDB.put(targetDocId, fullPackage);

                        let currentStoredMeta = await WorkspaceDB.get('docs_meta') || [];
                        if (!Array.isArray(currentStoredMeta) || currentStoredMeta.length === 0) {
                            currentStoredMeta = [...docs];
                        }

                        let updatedDocs = currentStoredMeta.map(d => d.id === targetDocId ? { ...d, name: newName, type: 'docx' } : d);
                        if (!updatedDocs.some(d => d.id === targetDocId)) {
                            updatedDocs.push({ id: targetDocId, name: newName, type: 'docx' });
                        }

                        await WorkspaceDB.put('docs_meta', updatedDocs);
                        setDocs(updatedDocs);
                        await refreshStoredRegistry();

                        AviationDB.setLoadedPackage(fullPackage);
                        setDocData(fullPackage);
                        setDataCount(Object.keys(parsedArticles).length);
                        setAppendixCount(Object.keys(extractedAppendices).length);
                        setActiveDocId(targetDocId);
                        setTab('all');
                        setPartFilter('all');
                        setChapterFilter('all');
                        setSearch('');
                        setPage(1);
                        setJumpHistory(null);

                        const allIds = AviationDB.getAllIds();
                        if (allIds.length > 0) setSingleId(allIds[0]);

                        notify(`🎉 Đã nạp thành công [${mode.toUpperCase()}] "${newName}" (${Object.keys(parsedArticles).length} mục & Bảng)!`);
                    })
                    .catch(function(err) {
                        console.error("Lỗi nạp Word:", err);
                        alert("Lỗi khi đọc file Word: " + err.message);
                    })
                    .finally(function() {
                        setImporting(false);
                    });
            };

            const handleUploadAppendixDataBulk = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const fileName = file.name;
                const isWord = fileName.toLowerCase().endsWith('.docx');
                const isText = fileName.toLowerCase().endsWith('.txt');

                if (!isWord && !isText) {
                    alert("Vui lòng chọn file Word (.docx) hoặc file Văn bản (.txt)");
                    return;
                }

                notify(`⏳ Đang nạp CSDL Phụ lục từ "${fileName}"...`);

                const saveAppendixTextToDB = async (text) => {
                    let pkg = GLOBAL_DOCS_STORE[activeDocId] || await WorkspaceDB.get(activeDocId) || AviationDB.getRawPackage();

                        let currentStoredMeta = await WorkspaceDB.get('docs_meta') || docs;

                                            <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl rounded-tl-none p-3 shadow-xs flex items-center gap-2 text-slate-500">
                                                <span className="animate-spin text-sm">⏳</span>
                                                <span className="text-xs font-semibold">Trợ lý AI đang đối soát PDF và tra cứu...</span>
                                            </div>
                                        </div>
                                    )}
                                    <div ref={chatEndRef} />
                                </div>

                                {aiAttachment && (
                                    <div className="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-950/50 border-t border-indigo-100 dark:border-indigo-900/50 flex items-center justify-between text-xs text-indigo-700 dark:text-indigo-300">
                                        <div className="flex items-center gap-1.5 truncate">
                                            <span>📎</span>
                                            <span className="truncate font-semibold text-[11px]">{aiAttachment.name}</span>
                                        </div>
                                        <button onClick={() => setAiAttachment(null)} className="text-slate-400 hover:text-rose-500 font-bold ml-2">✕</button>
                                    </div>
                                )}

                                <div className="p-2.5 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shrink-0">
                                    <form onSubmit={(e) => { e.preventDefault(); handleSendAiMessage(); }} className="flex items-center gap-1.5">
                                        <label className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 rounded-xl cursor-pointer transition" title="Đính kèm file hoặc ảnh">
                                            <span>📎</span>
                                            <input ref={aiFileInputRef} type="file" className="hidden" onChange={handleAiAttachmentUpload} />
                                        </label>
                                        <input 
                                            type="text" 
                                            placeholder="Hỏi về Điều khoản, Phụ lục hoặc quy định..." 
                                            value={aiInput} 
                                            onChange={e => setAiInput(e.target.value)} 
                                            className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-aviation-500" 
                                        />
                                        <button 
                                            type="submit" 
                                            disabled={aiLoading || (!aiInput.trim() && !aiAttachment)} 
                                            className="px-3.5 py-2 bg-aviation-600 hover:bg-aviation-500 disabled:opacity-40 text-white rounded-xl text-xs font-bold shadow flex items-center gap-1 transition"
                                        >
                                            <span>Gửi</span>
                                            <span>&rarr;</span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        <footer className="bg-white dark:bg-slate-800 border-t py-3 text-center text-xs text-slate-400 no-print">
                            Hệ thống tra cứu Quy chế & Tài liệu Hàng không • Tích hợp Đối soát PDF Phụ lục, Dịch thuật ICAO & Trợ lý AI
                        </footer>
                    </div>
                </ErrorBoundary>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    
    </script>
</body>
</html>
