            // HÀM ĐỌC TOÀN VĂN NỘI DUNG ĐIỀU KHOẢN VÀ CẢ TOÀN VĂN CÁC PHỤ LỤC VÀO CSDL CHO AI
            const processWordFileForDocx = (arrayBuffer, isMainDoc, targetDocId, newName, keepExistingAppendices = false) => {
                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(async function(result) {
                        const rawText = result.value || '';
                        const allLines = rawText.split(/\r?\n/)
                            .map(l => l.replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\u00A0/g, ' ').trim())
                            .filter(l => l.length > 0);

                        let hasVietnameseArticles = false;
                        for (let l of allLines.slice(0, 100)) {
                            if (/^(?:ĐIỀU|Điều|Ðiều|DIEU)\s+\d+/i.test(l)) {
                                hasVietnameseArticles = true;
                                break;
                            }
                        }

                        let currentPart = hasVietnameseArticles ? "Phần chung" : "PART 1";
                        let currentChapter = hasVietnameseArticles ? "Chương 1" : "Section 1.1";
                        let appendixStartIndex = allLines.length;

                        const knownPartsMap = {};

                        let existingPkg = await WorkspaceDB.get(targetDocId);
                        let extractedAppendices = {};
                        if (keepExistingAppendices && existingPkg && existingPkg.appendices && Object.keys(existingPkg.appendices).length > 0) {
                            extractedAppendices = existingPkg.appendices;
                        } else if (isMainDoc) {
                            extractedAppendices = generateDefaultAppendices();
                        }

                        const unitBlacklist = /^(?:hours?|fh|fc|flight\s+hours?|cycles?|days?|months?|years?|weeks?|mins?|minutes?|secs?|seconds?|kg|lbs?|mm|cm|inches?|in|ft|feet|meters?|m|psi|bar|volts?|v|amp|amps?|knots?|kts?|nm|percent|%|deg|°c|°f|ea|times?)\b/i;

                        const level2HeadingRegex = /^(?:(?:SECTION|CHAPTER|PART|ARTICLE|CLAUSE|ITEM|MỤC)\s+)?(\d+\.\d+)(?!\.\d+)[\.\:\-\–\—\s\t]+([A-ZÀ-Ỹa-zà-ỹ].*)$/;
                        const vnArtRegex = /^(?:ĐIỀU|Điều|Ðiều|DIEU)\s+(\d+[a-zA-Z]?)(?:[\.\:\-]\s*|\s+)([A-ZÀ-Ỹa-zà-ỹ].*)$/;
                        const partRegex = /^(?:PHẦN|PHAN|PART)\s*([0-9IVXLCDM]+[A-Za-z]?)\b[\.\:\-\–\—\s]*(.*)$/i;
                        const chapRegex = /^(?:CHƯƠNG|CHUONG|CHAPTER|MỤC)\s*([0-9IVXLCDM\d\.]+)\b[\.\:\-\–\—\s]*(.*)$/i;
                        const subHeadingDetectRegex = /^(\d+\.\d+\.\d+(?:\.\d+)?)\s*[\.\:\-\–\—\s\t]+(.*)$/;

                        const articlePositions = [];
                        const appendixPositions = [];

                        for (let i = 0; i < allLines.length; i++) {
                            const line = allLines[i];
                            if (!line || line.length < 2) continue;

                            if (/\s+\d+$/.test(line) || /[\.\_\–\—\t]{2,}\s*\d+$/.test(line)) continue;
                            if (/\d{1,2}\/\d{1,2}\/\d{2,4}/.test(line)) continue;

                            const pMatch = line.match(partRegex);
                            if (pMatch && line.length < 150 && /[a-zA-ZÀ-ỹ]{2,}/.test(line)) {
                                let pNum = pMatch[1].toUpperCase();
                                let rawPName = (pMatch[2] || '').trim().replace(/^[\.\:\-\–\—\s]+/, '').trim();
                                let pName = (rawPName && /[a-zA-ZÀ-ỹ]{2,}/.test(rawPName) && !/^(?:page|trang)\s*\d+/i.test(rawPName)) ? rawPName : '';
                                currentPart = pName ? `PART ${pNum} - ${pName}` : `PART ${pNum}`;
                                knownPartsMap[pNum] = currentPart;
                                currentChapter = currentPart;
                                continue;
                            }

                            const cMatch = line.match(chapRegex);
                            if (cMatch && line.length < 150 && /[a-zA-ZÀ-ỹ]{2,}/.test(line)) {
                                let cNum = cMatch[1].toUpperCase();
                                let rawCName = (cMatch[2] || '').trim().replace(/^[\.\:\-\–\—\s]+/, '').trim();
                                let cName = (rawCName && /[a-zA-ZÀ-ỹ]{2,}/.test(rawCName)) ? rawCName : '';
                                currentChapter = cName ? `Chương ${cNum} - ${cName}` : `Chương ${cNum}`;
                                continue;
                            }

                            if (hasVietnameseArticles) {
                                const vMatch = line.match(vnArtRegex);
                                if (vMatch) {
                                    const num = vMatch[1];
                                    const title = vMatch[2] ? vMatch[2].trim() : "";
                                    if ((title.match(/[a-zA-ZÀ-ỹ]/g) || []).length >= 2) {
                                        articlePositions.push({
                                            num: num,
                                            code: `Điều ${num}`,
                                            title: title ? `Điều ${num}. ${title}` : `Điều ${num}`,
                                            chapter: currentChapter,
                                            part: currentPart,
                                            index: i
                                        });
                                    }
                                    continue;
                                }
                            } else {
                                const mMatch = line.match(level2HeadingRegex);
                                if (mMatch) {
                                    let code = mMatch[1].trim();
                                    let rawTitle = (mMatch[2] || '').trim();

                                    if (unitBlacklist.test(rawTitle)) {
                                        continue;
                                    }

                                    const isCapitalized = /^[A-ZÀ-Ỹ]/.test(rawTitle);
                                    const letterCount = (rawTitle.match(/[a-zA-ZÀ-ỹ]/g) || []).length;

                                    if (isCapitalized && letterCount >= 3) {
                                        let fullTitle = rawTitle.startsWith(code) ? rawTitle : `${code} ${rawTitle}`;
                                        
                                        const partNumFromCode = code.split('.')[0];
                                        if (knownPartsMap[partNumFromCode]) {
                                            currentPart = knownPartsMap[partNumFromCode];
                                        } else {
                                            currentPart = `PART ${partNumFromCode}`;
                                        }

                                        currentChapter = `Section ${code} - ${rawTitle}`;

                                        articlePositions.push({
                                            num: code,
                                            code: code,
                                            title: fullTitle,
                                            chapter: currentChapter,
                                            part: currentPart,
                                            index: i
                                        });
                                    }
                                    continue;
                                }
                            }

                            // GHI NHẬN VỊ TRÍ PHỤ LỤC ĐỂ ĐỌC TRỌN VẸN TOÀN BỘ NỘI DUNG VÀO CSDL CHO AI
                            if (!keepExistingAppendices) {
                                const appMatch = line.match(/^(?:PHỤ\s*LỤC|PHU\s*LUC|APPENDIX|ATTACHMENT|MẪU\s*SỐ|FORM)\s*(?:SỐ|NO)?[\s\.\:\-]*([IVXLCDM\d]+[A-Z]?)\b[\.\:\-\–\—\s]*(.*)$/i);
                                if (appMatch && line.length < 200) {
                                    if (appendixStartIndex === allLines.length) appendixStartIndex = i;
                                    let rawCode = appMatch[1].toUpperCase();
                                    let appTitle = (appMatch[2] || '').trim().replace(/^[\.\:\-\–\—\s]+/, '').trim();
                                    let codePrefix = `Appendix ${rawCode}`;
                                    let finalTitle = appTitle ? `${codePrefix} - ${appTitle}` : (line || codePrefix);
                                    appendixPositions.push({
                                        index: i,
                                        code: rawCode,
                                        title: finalTitle,
                                        codePrefix: codePrefix
                                    });
                                }
                            }
                        }

                        // ĐỌC VÀ LƯU TOÀN VĂN NỘI DUNG CÁC PHỤ LỤC TỪNG ĐOẠN ĐẾN HẾT FILE
                        if (!keepExistingAppendices && appendixPositions.length > 0) {
                            for (let j = 0; j < appendixPositions.length; j++) {
                                const currApp = appendixPositions[j];
                                const nextApp = appendixPositions[j + 1];
                                const endAppIdx = nextApp ? nextApp.index : allLines.length;
                                const appLines = allLines.slice(currApp.index, endAppIdx);
                                const appText = appLines.join('\n').trim();

                                let key = `app_${j + 1}`;
                                extractedAppendices[key] = {
                                    id: key,
                                    code: currApp.code,
                                    title: currApp.title,
                                    plainText: appText || `Tài liệu biểu mẫu (${currApp.codePrefix}).`,
                                    pdfFileName: "",
                                    pdfFileUrl: "",
                                    wordFileName: "",
                                    wordFileUrl: ""
                                };
                            }
                        }

                        articlePositions.sort((a, b) => naturalCompareSectionCodes(a.num, b.num));

                        const parsedArticles = {};
                        const dynamicPartsMap = {};
                        let genericPartCounter = 1;
                        const docPrefix = targetDocId;

                        for (let i = 0; i < articlePositions.length; i++) {
                            const curr = articlePositions[i];
                            const startIdx = curr.index;
                            const nextPos = articlePositions[i + 1];
                            const endIdx = nextPos ? nextPos.index : appendixStartIndex;

                            const sliceLines = allLines.slice(startIdx, endIdx);
                            const plainText = sliceLines.join('\n').trim();

                            const htmlLines = sliceLines.map((l, lineIdx) => {
                                if (lineIdx === 0) {
                                    return `<h3 style="font-weight: bold; color: #0369a1; margin-bottom: 8px;">${l}</h3>`;
                                }
                                if (subHeadingDetectRegex.test(l)) {
                                    return `<p style="margin-top: 12px; margin-bottom: 4px;"><strong>${l}</strong></p>`;
                                }
                                return `<p style="margin-bottom: 6px;">${l}</p>`;
                            });

                            const htmlContent = htmlLines.join('');

                            let pTitle = curr.part || "PART 1";
                            let pId;
                            const partKey = `${docPrefix}_${pTitle}`;
                            if (!dynamicPartsMap[partKey]) {
                                pId = `${docPrefix}_p_${genericPartCounter++}`;
                                dynamicPartsMap[partKey] = { id: pId, title: pTitle, start: curr.code, end: curr.code, cat: pTitle, count: 1 };
                            } else {
                                pId = dynamicPartsMap[partKey].id;
                                dynamicPartsMap[partKey].end = curr.code;
                                dynamicPartsMap[partKey].count = (dynamicPartsMap[partKey].count || 0) + 1;
                            }

                            parsedArticles[curr.num] = {
                                id: curr.num,
                                code: curr.code,
                                title: curr.title,
                                chapter: curr.chapter || `Section ${curr.code}`,
                                partTitle: pTitle,
                                partId: pId,
                                htmlContent: htmlContent,
                                plainText: plainText || curr.title,
                                translatedText: "",
                                isVerbatim: true
                            };
                        }

                        if (Object.keys(parsedArticles).length === 0) {
                            parsedArticles["1.0"] = {
                                id: "1.0", code: "1.0", title: newName ? newName.replace(/\.docx$/i, '') : "Toàn văn tài liệu",

                                htmlContent: allLines.map(l => `<p>${l}</p>`).join(''),
                                plainText: allLines.join('\n'), translatedText: "", isVerbatim: true
                            };
                        }

                        const fullPackage = {
                            name: newName,
                            articles: parsedArticles,
                            parts: Object.values(dynamicPartsMap),
                            appendices: extractedAppendices
                        };

                        await WorkspaceDB.put(targetDocId, fullPackage);
                        const updatedDocs = docs.map(d => d.id === targetDocId ? { ...d, name: newName, type: 'docx' } : d);
                        if (!docs.some(d => d.id === targetDocId)) updatedDocs.push({ id: targetDocId, name: newName, type: 'docx' });

            const handleNewDocUpload = async (e) => {

                const isDocx = newName.toLowerCase().endsWith('.docx');
                
                const existing = savedRegistry.find(r => r.name.toLowerCase() === newName.toLowerCase());
                let targetId = existing ? existing.id : ('doc_' + Date.now());

                setImporting(true);
                setUploadMenuModal(false);
                notify(`Đang xử lý: ${newName}...`);

                if (isPdf) {
                    const reader = new FileReader();
                    reader.onload = async (event) => {
                        const base64 = event.target.result;
                        const newDocs = docs.some(d => d.id === targetId) 
                            ? docs.map(d => d.id === targetId ? { id: targetId, name: newName, type: 'pdf' } : d)

                        await WorkspaceDB.put(targetId, { pdfUrl: base64, name: newName });
                        await refreshStoredRegistry();
                        switchDoc(targetId);
                        setImporting(false);
                        e.target.value = '';

                    reader.readAsDataURL(file);
                } else if (isDocx) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        processWordFileForDocx(event.target.result, targetId === 'main', targetId, newName, Boolean(existing));

                    reader.readAsArrayBuffer(file);

                                                    if (!art) return null;
                                                    return (
                                                        <div key={art.id} className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-yellow-200 flex flex-col justify-between shadow-sm">
                                                            <div>
                                                                <div className="flex justify-between items-center mb-1"><span className="text-xs font-bold text-aviation-600">{art.code || `Điều ${art.id}`}</span></div>
                                                                <h4 className="font-bold text-xs mb-1">{art.title}</h4>
                                                            </div>
                                                            <button onClick={() => { setJumpHistory(null); setSingleId(art.id); setTab('single'); }} className="mt-2 text-xs text-aviation-600 font-semibold hover:underline">Xem chi tiết &rarr;</button>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}
                        </main>

                        {/* BÓNG CHAT AI */}
                        <div className="fixed bottom-6 right-6 z-40 no-print">
                            <button 
                                onClick={() => setAiOpen(prev => !prev)}
                                className="group relative flex items-center justify-center w-14 h-14 bg-gradient-to-r from-aviation-600 to-indigo-600 hover:from-aviation-500 hover:to-indigo-500 text-white rounded-full shadow-2xl transition duration-200 hover:scale-105 active:scale-95 focus:outline-none border-2 border-white/20"
                                title="Mở Trợ lý AI Hàng không"
                            >
                                <span className="text-2xl animate-pulse-slow">🤖</span>
                                <span className="absolute -top-1 -right-1 flex h-4 w-4">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 border-2 border-white"></span>
                                </span>
                            </button>
                        </div>

                        {/* KHUNG CỬA SỔ CHAT TRỢ LÝ AI */}
                        {aiOpen && (
                            <div className="fixed bottom-22 right-4 sm:right-6 z-50 w-[94vw] sm:w-[420px] md:w-[460px] h-[580px] max-h-[82vh] bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-300 dark:border-slate-700 flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom-5 duration-200 no-print">
                                <div className="bg-gradient-to-r from-aviation-800 to-indigo-800 text-white p-3.5 flex items-center justify-between shadow-sm shrink-0">
                                    <div className="flex items-center gap-2">
                                        <div className="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center text-base">🤖</div>
                                        <div>
                                            <h3 className="font-bold text-xs sm:text-sm leading-tight flex items-center gap-1.5">
                                                <span>Trợ lý Pháp chế An toàn Hàng không</span>
                                            </h3>
                                            <div className="text-[10px] text-aviation-200 flex items-center gap-1 mt-0.5">
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                                <span className="truncate max-w-[170px]">{selectedModel}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-1">
                                        <button 
                                            onClick={() => { setTempApiKey(aiApiKey); setShowKeySetting(true); }} 
                                            className="p-1.5 hover:bg-white/10 rounded-lg text-xs" 
                                            title="Cấu hình API Key & Model"
                                        >
                                            ⚙️
                                        </button>
                                        <button 
                                            onClick={() => setAiOpen(false)} 
                                            className="p-1.5 hover:bg-white/10 rounded-lg text-sm font-bold w-7 h-7 flex items-center justify-center"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3.5 space-y-3 custom-scrollbar text-xs bg-slate-50 dark:bg-slate-950/60">
                                    {aiMessages.map((msg, idx) => {
                                        const references = msg.role === 'model' && !msg.isError
                                            ? extractReferencesFromAiText(msg.text, docs, activeDocId, activeDocName, AviationDB.getArticlesMap(), AviationDB.getAppendicesMap())
                                            : [];

                                        return (
                                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[90%] rounded-2xl p-3 shadow-xs space-y-1.5 ${msg.role === 'user' ? 'bg-aviation-600 text-white rounded-tr-none' : msg.isError ? 'bg-rose-50 dark:bg-rose-950/60 text-rose-800 dark:text-rose-200 border border-rose-200 rounded-tl-none' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-tl-none'}`}>
                                                    {msg.attachment && (
                                                        <div className="text-[10px] opacity-80 pb-1 border-b border-white/20 flex items-center gap-1">
                                                            <span>📎</span>
                                                            <span className="truncate font-semibold">{msg.attachment.name}</span>
                                                        </div>
                                                    )}
                                                    <div className="whitespace-pre-line leading-relaxed text-[12px] break-words">{msg.text}</div>
                                                    
                                                    {references.length > 0 && (
                                                        <div className="mt-2.5 pt-2 border-t border-slate-200 dark:border-slate-700 space-y-1.5">
                                                            <div className="text-[10px] font-bold uppercase tracking-wider text-aviation-600 dark:text-aviation-400 flex items-center gap-1">
                                                                <span>📌</span>
                                                                <span>Điều khoản & Phụ lục được trích dẫn:</span>
                                                            </div>
                                                            <div className="flex flex-wrap gap-1.5">
                                                                {references.map((ref, rIdx) => (
                                                                    <button
                                                                        type="button"
                                                                        key={rIdx}
                                                                        onClick={(e) => {
                                                                            e.preventDefault();
                                                                            e.stopPropagation();
                                                                            handleDirectJumpFromAi(ref);
                                                                        }}
                                                                        className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-aviation-50 hover:bg-aviation-100 dark:bg-aviation-950/80 dark:hover:bg-aviation-900 border border-aviation-300 dark:border-aviation-600 text-[11px] font-bold text-aviation-800 dark:text-aviation-200 transition hover:scale-105 shadow-xs cursor-pointer select-none"
                                                                        title={`Bấm để mở [${ref.code}] trong tài liệu "${ref.docName}"`}
                                                                    >
                                                                        <span>🔗</span>
                                                                        <span className="text-aviation-600 dark:text-aviation-400 font-extrabold max-w-[120px] truncate">[{ref.docName}]</span>
                                                                        <span>{ref.code}</span>
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}

                                                    <div className={`text-[9px] text-right mt-1 ${msg.role === 'user' ? 'text-aviation-100' : 'text-slate-400'}`}>
                                                        {msg.time}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {aiLoading && (
                                        <div className="flex justify-start">
                                            <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl rounded-tl-none p-3 shadow-xs flex items-center gap-2 text-slate-500">
                                                <span className="animate-spin text-sm">⏳</span>
                                                <span className="text-xs font-semibold">Trợ lý AI đang tra cứu & suy luận...</span>
                                            </div>
                                        </div>
                                    )}
                                    <div ref={chatEndRef} />
                                </div>

                                {aiAttachment && (
                                    <div className="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-950/50 border-t border-indigo-100 dark:border-indigo-900/50 flex items-center justify-between text-xs text-indigo-700 dark:text-indigo-300">
                                        <div className="flex items-center gap-1.5 truncate">
                                            <span>📎</span>
                                            <span className="truncate font-semibold text-[11px]">{aiAttachment.name}</span>
                                        </div>
                                        <button onClick={() => setAiAttachment(null)} className="text-slate-400 hover:text-rose-500 font-bold ml-2">✕</button>
                                    </div>
                                )}

                                <div className="p-2.5 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shrink-0">
                                    <form onSubmit={(e) => { e.preventDefault(); handleSendAiMessage(); }} className="flex items-center gap-1.5">
                                        <label className="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 rounded-xl cursor-pointer transition" title="Đính kèm file hoặc ảnh">
                                            <span>📎</span>
                                            <input ref={aiFileInputRef} type="file" className="hidden" onChange={handleAiAttachmentUpload} />
                                        </label>
                                        <input 
                                            type="text" 
                                            placeholder="Hỏi về Điều khoản, Phụ lục hoặc quy định..." 
                                            value={aiInput} 
                                            onChange={e => setAiInput(e.target.value)} 
                                            className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-aviation-500" 
                                        />
                                        <button 
                                            type="submit" 
                                            disabled={aiLoading || (!aiInput.trim() && !aiAttachment)} 
                                            className="px-3.5 py-2 bg-aviation-600 hover:bg-aviation-500 disabled:opacity-40 text-white rounded-xl text-xs font-bold shadow flex items-center gap-1 transition"
                                        >
                                            <span>Gửi</span>
                                            <span>&rarr;</span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        <footer className="bg-white dark:bg-slate-800 border-t py-3 text-center text-xs text-slate-400 no-print">
                            Hệ thống tra cứu Quy chế & Tài liệu Hàng không • Tích hợp Dịch thuật ICAO, Đối chiếu So sánh Đa văn bản & Trợ lý AI
                        </footer>
                    </div>
                </ErrorBoundary>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    
    </script>
</body>
</html>
