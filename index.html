<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="text/babel">

        // ĐĂNG KÝ SERVICE WORKER CHO PWA NẾU ĐANG CHẠY MÔI TRƯỜNG WEB (HTTP/HTTPS)
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('✅ PWA ServiceWorker đã khởi chạy:', reg.scope);
                }).catch(err => {
                    console.log('⚠️ ServiceWorker không hoạt động cục bộ:', err);
                });
            });
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("Lỗi Render React:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-300 dark:border-slate-700 max-w-lg w-full text-center space-y-4">
                                <div className="text-4xl">⚠️</div>
                                <h2 className="text-base font-bold text-rose-600">Đã phát hiện sự cố hiển thị</h2>
                                <p className="text-xs text-slate-500">{this.state.error?.message || "Đang tải dữ liệu..."}</p>
                                <button onClick={() => { this.setState({ hasError: false }); window.location.reload(); }} className="px-4 py-2 bg-aviation-600 hover:bg-aviation-500 text-white text-xs font-bold rounded-xl shadow">
                                    🔄 Tải lại trang
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const naturalCompareSectionCodes = (a, b) => {
            if (a === b) return 0;
            const parseSegments = (str) => {
                const clean = String(str).replace(/^(?:ĐIỀU|Điều|Ðiều|DIEU|Mục|Muc|Section|Clause|Part|Phần|Chương)\s*/i, '').trim();
                return clean.split(/[\.\-\_\s]+/).map(seg => {
                    const num = parseInt(seg, 10);
                    return isNaN(num) ? seg.toLowerCase() : num;
                });
            };

            const segsA = parseSegments(a);
            const segsB = parseSegments(b);
            const len = Math.max(segsA.length, segsB.length);

            for (let i = 0; i < len; i++) {
                const valA = segsA[i];
                const valB = segsB[i];

                if (valA === undefined) return -1;
                if (valB === undefined) return 1;

                if (typeof valA === 'number' && typeof valB === 'number') {
                    if (valA !== valB) return valA - valB;
                } else {
                    const cmp = String(valA).localeCompare(String(valB), undefined, { numeric: true, sensitivity: 'base' });
                    if (cmp !== 0) return cmp;
                }
            }
            return 0;
        };

        const renderTextWithHyperlinks = (text, onJump) => {
            if (!text || typeof text !== 'string') return text;
            
            const linkRegex = /(?:(?:ĐIỀU|Điều|Ðiều|DIEU)\s*(\d+[a-zA-Z]?(?:\.\d+)*))|(?:(?:Mục|Muc|Section|Clause|Item)\s*(\d+\.\d+(?:\.\d+)*))|(?:(?:Phụ\s*lục|Phu\s*luc|Appendix|Attachment)\s*([0-9A-Za-zIVXLCDM]+))|(\b\d+\.\d+(?:\.\d+)+\b)/gi;
            
            const elements = [];
            let lastIndex = 0;
            let match;
            let keyCounter = 0;

            while ((match = linkRegex.exec(text)) !== null) {
                const matchStart = match.index;
                const matchEnd = linkRegex.lastIndex;
                const fullMatch = match[0];

                if (matchStart > lastIndex) {
                    elements.push(text.substring(lastIndex, matchStart));
                }

                let targetCode = (match[1] || match[2] || match[3] || match[4] || fullMatch).trim();
                let isAppendix = /(?:Phụ\s*lục|Phu\s*luc|Appendix|Attachment)/i.test(fullMatch);

                elements.push(
                    <span
                        key={`link_${keyCounter++}`}
                        onClick={(e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            if (onJump) onJump({ code: targetCode, isAppendix: isAppendix, raw: fullMatch });
                        }}
                        className="inline-flex items-center gap-0.5 text-aviation-600 dark:text-aviation-400 font-bold underline decoration-aviation-400 hover:text-aviation-800 dark:hover:text-aviation-200 cursor-pointer bg-aviation-50/80 dark:bg-aviation-950/60 px-1 py-0.5 rounded transition hover:scale-105 select-none mx-0.5"
                        title={`Bấm để chọn tài liệu mở ${fullMatch}`}
                    >
                        <span>🔗</span>
                        <span>{fullMatch}</span>
                    </span>
                );

                lastIndex = matchEnd;
            }

            if (lastIndex < text.length) {
                elements.push(text.substring(lastIndex));
            }

            return elements.length > 0 ? elements : text;
        };

        const renderFormattedContent = (content, onJump) => {
            if (!content) return null;
            const lines = content.split('\n');
            
            const headingRegex = /^(\d+(\.\d+){2,}\.?\s*.*)$/i;
            const labelRegex = /^(reference|căn cứ|note|lưu ý|purpose|mục đích|scope|phạm vi|procedure|quy trình|responsibility|trách nhiệm|yêu cầu)\s*[:\-–]/i;
            const clauseRegex = /^(khoản\s+\d+|điểm\s+[a-zđ]|mục\s+\d+|chương\s+\d+)/i;

            return lines.map((line, idx) => {
                const trimmed = line.trim();
                if (!trimmed) {
                    return <div key={idx} className="h-2"></div>;
                }

                if (headingRegex.test(trimmed)) {
                    return (
                        <div key={idx} className="mt-3.5 mb-1.5 font-bold text-slate-900 dark:text-white text-[14px] bg-slate-100/90 dark:bg-slate-800/90 px-2.5 py-1 rounded border-l-4 border-aviation-600 shadow-xs">
                            {renderTextWithHyperlinks(line, onJump)}
                        </div>
                    );
                }

                if (labelRegex.test(trimmed) || clauseRegex.test(trimmed)) {
                    return (
                        <div key={idx} className="mt-2.5 mb-1 font-bold text-aviation-800 dark:text-aviation-300 text-[13px]">
                            {renderTextWithHyperlinks(line, onJump)}
                        </div>
                    );
                }

                return (
                    <p key={idx} className="mb-1.5 leading-relaxed text-slate-800 dark:text-slate-200 text-[13.5px]">
                        {renderTextWithHyperlinks(line, onJump)}
                    </p>
                );
            });
        };

        const extractReferencesFromAiText = (text, docsList, activeDocId, activeDocName, articlesMap, appendicesMap) => {
            if (!text || typeof text !== 'string') return [];
            const results = [];
            const seen = new Set();

            const refRegex = /(?:(?:ĐIỀU|Điều|Ðiều|DIEU)\s*(\d+[a-zA-Z]?(?:\.\d+)*))|(?:(?:Mục|Muc|Section|Clause|Item)\s*(\d+\.\d+(?:\.\d+)*))|(?:(?:Phụ\s*lục|Phu\s*luc|Appendix|Attachment)\s*([0-9A-Za-zIVXLCDM]+))|(\b\d+\.\d+(?:\.\d+)*\b)/gi;

            const allArts = articlesMap ? Object.values(articlesMap) : [];
            const allApps = appendicesMap ? Object.values(appendicesMap) : [];

            let match;
            while ((match = refRegex.exec(text)) !== null) {
                const rawCode = (match[1] || match[2] || match[3] || match[4] || '').trim();
                const uniqueKey = rawCode.toLowerCase();
                if (!rawCode || seen.has(uniqueKey)) continue;

                const matchedArt = allArts.find(a => 
                    String(a.id).trim().toLowerCase() === uniqueKey ||
                    (a.code && a.code.toLowerCase().replace(/^(?:điều|mục|section)\s*/i, '').trim() === uniqueKey) ||
                    (a.code && a.code.toLowerCase() === uniqueKey)
                );

                if (matchedArt) {
                    seen.add(uniqueKey);
                    results.push({
                        docId: activeDocId,
                        docName: activeDocName,
                        type: 'article',
                        id: matchedArt.id,
                        code: matchedArt.code || `Mục ${matchedArt.id}`,
                        raw: match[0],
                        title: matchedArt.title
                    });
                    continue;
                }

                const matchedApp = allApps.find(app =>
                    String(app.id).toLowerCase() === uniqueKey ||
                    String(app.code || '').toLowerCase() === uniqueKey ||
                    (app.code && app.code.toLowerCase().replace(/^(?:phụ lục|appendix)\s*/i, '').trim() === uniqueKey)
                );

                if (matchedApp) {
                    seen.add(uniqueKey);
                    results.push({
                        docId: activeDocId,
                        docName: activeDocName,
                        type: 'appendix',
                        id: matchedApp.id,
                        code: matchedApp.code ? `Phụ lục ${matchedApp.code}` : matchedApp.title,
                        raw: match[0],
                        title: matchedApp.title
                    });
                    continue;
                }

                if (/^\d+(\.\d+)+$/.test(rawCode) || /^\d+$/.test(rawCode)) {
                    seen.add(uniqueKey);
                    results.push({
                        docId: activeDocId,
                        docName: activeDocName,
                        type: 'article',
                        id: rawCode,
                        code: `Mục ${rawCode}`,
                        raw: match[0],
                        title: `Mục ${rawCode}`
                    });
                }
            }

            return results;
        };

        const solidParseJson = (rawText) => {
            if (!rawText || typeof rawText !== 'string') {
                throw new Error("Phản hồi từ AI trống.");
            }
            let cleaned = rawText.trim();
            cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

            try {
                const parsed = JSON.parse(cleaned);
                if (Array.isArray(parsed)) return parsed;
                if (parsed && typeof parsed === 'object') return [parsed];
            } catch (e) {}

            const firstBracket = cleaned.indexOf('[');
            const firstBrace = cleaned.indexOf('{');

            if (firstBracket !== -1 && (firstBrace === -1 || firstBracket < firstBrace)) {
                const lastBracket = cleaned.lastIndexOf(']');
                if (lastBracket !== -1 && lastBracket > firstBracket) {
                    try {
                        const sub = cleaned.substring(firstBracket, lastBracket + 1);
                        const parsed = JSON.parse(sub);
                        if (Array.isArray(parsed)) return parsed;
                    } catch (e) {}
                }
            }

            if (firstBrace !== -1) {
                const lastBrace = cleaned.lastIndexOf('}');
                if (lastBrace !== -1 && lastBrace > firstBrace) {
                    try {
                        const sub = cleaned.substring(firstBrace, lastBrace + 1);
                        const parsed = JSON.parse(sub);
                        if (Array.isArray(parsed)) return parsed;
                        if (parsed && typeof parsed === 'object') return [parsed];
                    } catch (e) {}
                }
            }

            throw new Error("AI không trả về cấu trúc JSON hợp lệ.");
        };

        const quickGoogleTranslate = async (text, targetLang = 'vi', sourceLang = 'auto') => {
            if (!text || !text.trim()) return '';
            
            const paragraphs = text.split('\n');
            const chunks = [];
            let currentChunk = '';
            
            for (const p of paragraphs) {
                if ((currentChunk + '\n' + p).length > 1500) {
                    if (currentChunk) chunks.push(currentChunk);
                    currentChunk = p;
                } else {
                    currentChunk = currentChunk ? (currentChunk + '\n' + p) : p;
                }
            }
            if (currentChunk) chunks.push(currentChunk);
            
            const translatedChunks = [];
            for (const chunk of chunks) {
                if (!chunk.trim()) {
                    translatedChunks.push('');
                    continue;
                }
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sourceLang)}&tl=${encodeURIComponent(targetLang)}&dt=t&q=${encodeURIComponent(chunk)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error("Không thể kết nối máy chủ dịch thuật");
                const data = await res.json();
                if (data && data[0] && Array.isArray(data[0])) {
                    const piece = data[0].map(item => (item && item[0]) ? item[0] : '').join('');
                    translatedChunks.push(piece);
                } else {
                    translatedChunks.push(chunk);
                }
            }
            return translatedChunks.join('\n');
        };

        const formatOptionText = (text, maxLen = 60) => {
            if (!text || typeof text !== 'string') return '';
            const clean = text.replace(/\s+/g, ' ').trim();
            if (clean.length <= maxLen) return clean;
            return clean.substring(0, maxLen - 3) + '...';
        };

        const sanitizeFileName = (name, defaultExt = '') => {
            if (!name || typeof name !== 'string') return 'TaiLieu' + (defaultExt ? '.' + defaultExt : '');
            let clean = name.replace(/[/\\:*?"<>|\r\n\t]/g, '_').trim();
            clean = clean.replace(/\s+/g, ' ').replace(/\.+$/, '');
            if (defaultExt) {
                const extRegex = new RegExp('\\.' + defaultExt + '$', 'i');
                if (!extRegex.test(clean)) clean += '.' + defaultExt;
            }
            return clean || ('TaiLieu' + (defaultExt ? '.' + defaultExt : ''));
        };

        const generateWordDocFromText = (title, text) => {
            const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset='utf-8'><title>${title}</title><style>body{font-family:'Times New Roman',serif;font-size:14pt;line-height:1.5;}</style></head>
<body><h2>${title}</h2><p>${(text || '').replace(/\n/g, '<br/>')}</p></body></html>`;
            return new Blob(['\ufeff', html], { type: 'application/msword' });
        };

        function dataURLtoBlob(dataurl) {
            if (!dataurl) return null;
            if (dataurl instanceof Blob) return dataurl;
            if (typeof dataurl !== 'string') return null;

            try {
                let mime = 'application/octet-stream';
                let b64Data = dataurl;

                if (dataurl.startsWith('data:')) {
                    const parts = dataurl.split(',');
                    const mimeMatch = parts[0].match(/:(.*?);/);
                    if (mimeMatch) mime = mimeMatch[1];
                    b64Data = parts[1] || '';
                }

                const cleanB64 = b64Data.replace(/[\s\r\n]/g, '');
                const byteCharacters = atob(cleanB64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                return new Blob([new Uint8Array(byteNumbers)], { type: mime });
            } catch (e) {
                return new Blob([dataurl], { type: 'text/plain;charset=utf-8' });
            }
        }

        const triggerFileDownload = (dataOrUrl, filename) => {
            if (!dataOrUrl) return;
            try {
                let blob = null;
                const cleanName = sanitizeFileName(filename);

                if (dataOrUrl instanceof Blob) blob = dataOrUrl;
                else if (typeof dataOrUrl === 'string') {
                    if (dataOrUrl.startsWith('blob:')) {
                        const a = document.createElement('a');
                        a.href = dataOrUrl;
                        a.download = cleanName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        return;
                    } else blob = dataURLtoBlob(dataOrUrl);
                }

                if (!blob) return;
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = cleanName;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    if (document.body.contains(a)) document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 30000);
            } catch (err) {
                console.error("Lỗi triggerFileDownload:", err);
            }
        };

        const copyToClipboard = async (text) => {
            if (!text) return false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                return successful;
            } catch (err) {
                return false;
            }
        };

        function UniversalPdfViewer({ base64Data, fileName, title }) {
            const [pageNum, setPageNum] = React.useState(1);
            const [numPages, setNumPages] = React.useState(0);
            const [scale, setScale] = React.useState(window.innerWidth < 640 ? 1.0 : 1.3);
            const [loading, setLoading] = React.useState(true);
            const [error, setError] = React.useState(null);
            const canvasRef = React.useRef(null);
            const pdfDocRef = React.useRef(null);
            const renderTaskRef = React.useRef(null);
            const containerRef = React.useRef(null);

            React.useEffect(() => {
                if (!base64Data) return;
                setLoading(true);
                setError(null);
                try {
                    const rawBase64 = base64Data.includes(',') ? base64Data.split(',')[1].replace(/[\s\r\n]/g, '') : base64Data.replace(/[\s\r\n]/g, '');
                    const binaryStr = atob(rawBase64);
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                        bytes[i] = binaryStr.charCodeAt(i);
                    }

                    if (window.pdfjsLib) {
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        const loadingTask = window.pdfjsLib.getDocument({ data: bytes });
                        loadingTask.promise.then((pdf) => {
                            pdfDocRef.current = pdf;
                            setNumPages(pdf.numPages);
                            setPageNum(1);
                            setLoading(false);
                        }).catch(err => {
                            setLoading(false);
                            setError("Không thể hiển thị PDF trực tiếp.");
                        });
                    } else {
                        setLoading(false);
                    }
                } catch (e) {
                    setLoading(false);
                    setError("Lỗi giải mã PDF");
                }
            }, [base64Data]);

            React.useEffect(() => {
                if (!pdfDocRef.current || !canvasRef.current) return;
                if (renderTaskRef.current) {
                    renderTaskRef.current.cancel();
                    renderTaskRef.current = null;
                }
                let isCancelled = false;
                pdfDocRef.current.getPage(pageNum).then(page => {
                    if (isCancelled) return;
                    
                    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                    const viewport = page.getViewport({ scale: scale * dpr });
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const context = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    canvas.style.width = `${viewport.width / dpr}px`;
                    canvas.style.height = `${viewport.height / dpr}px`;

                    const renderContext = { canvasContext: context, viewport: viewport };
                    const renderTask = page.render(renderContext);
                    renderTaskRef.current = renderTask;
                    renderTask.promise.catch(err => {});
                });

                return () => {
                    isCancelled = true;
                    if (renderTaskRef.current) {
                        renderTaskRef.current.cancel();
                        renderTaskRef.current = null;
                    }
                };
            }, [pageNum, scale, numPages]);

            const zoomIn = () => setScale(s => Math.min(4.0, Number((s + 0.2).toFixed(1))));
            const zoomOut = () => setScale(s => Math.max(0.4, Number((s - 0.2).toFixed(1))));
            const zoomReset = () => setScale(window.innerWidth < 640 ? 1.0 : 1.3);

            return (
                <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-300 dark:border-slate-700 shadow-lg">
                    <div className="bg-slate-800 text-white p-2 flex flex-wrap items-center justify-between gap-2 text-xs select-none">
                        <div className="flex items-center gap-1.5">
                            <span className="font-bold truncate max-w-[130px] sm:max-w-xs">{fileName || title || 'Xem trước PDF'}</span>
                            {numPages > 0 && (

        const getEmbeddedWorkspace = () => {

        const EMBEDDED_WORKSPACE = getEmbeddedWorkspace();
        const IDB_NAME = 'AviationSafety_MultiDocWorkspace_V3';

        let dbInstance = null;
        const WorkspaceDB = {
            open: function() {
                if (dbInstance) return Promise.resolve(dbInstance);
                return new Promise((resolve) => {
                    try {
                        if (!window.indexedDB) {
                            resolve(null);
                            return;
                        }
                        const request = indexedDB.open(IDB_NAME, 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('workspace')) {
                                db.createObjectStore('workspace', { keyPath: 'key' });
                            }
                        };
                        request.onsuccess = (e) => {
                            dbInstance = e.target.result;
                            resolve(dbInstance);
                        };
                        request.onerror = () => resolve(null);
                        request.onblocked = () => resolve(null);
                    } catch (e) {
                        resolve(null);
                    }
                });
            },
            put: async function(key, data) {
                const db = await this.open();
                if (!db) return true;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readwrite');
                        tx.objectStore('workspace').put({ key, data });
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            },
            get: async function(key) {
                const db = await this.open();
                if (!db) return null;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readonly');
                        const req = tx.objectStore('workspace').get(key);
                        req.onsuccess = () => resolve(req.result ? req.result.data : null);
                        req.onerror = () => resolve(null);
                    } catch (e) { resolve(null); }
                });
            },
            getAllEntries: async function() {
                const db = await this.open();
                if (!db) return [];
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readonly');
                        const req = tx.objectStore('workspace').getAll();
                        req.onsuccess = () => resolve(req.result || []);
                        req.onerror = () => resolve([]);
                    } catch (e) { resolve([]); }
                });
            },
            remove: async function(key) {
                const db = await this.open();
                if (!db) return true;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readwrite');
                        tx.objectStore('workspace').delete(key);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            },
            clearAll: async function() {
                const db = await this.open();
                if (!db) return true;
                return new Promise((resolve) => {
                    try {
                        const tx = db.transaction('workspace', 'readwrite');
                        tx.objectStore('workspace').clear();
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    } catch (e) { resolve(false); }
                });
            }
        };

        const AviationDB = (() => {
            let loadedArticles = {};
            let loadedParts = [];
            let loadedAppendices = {};
            const cache = new Map();

            const fallbackArticle = (id) => ({
                id: id,
                code: String(id),
                title: `Mục ${id}`,
                chapter: "",
                partTitle: "Văn bản chưa nạp",
                partId: '0',
                htmlContent: `<p>Nội dung chi tiết của Mục ${id} chưa được nạp từ file.</p>`,
                plainText: `Nội dung chi tiết của Mục ${id} chưa được nạp từ file.`,
                translatedText: "",
                isVerbatim: false
            });

            return {
                setLoadedPackage: (pkg) => {
                    if (!pkg) {
                        loadedArticles = {};
                        loadedParts = [];
                        loadedAppendices = {};
                    } else {
                        loadedArticles = pkg.articles || {};
                        loadedParts = pkg.parts || [];
                        loadedAppendices = pkg.appendices || {};
                    }
                    cache.clear();
                },
                getRawPackage: () => ({
                    articles: loadedArticles,
                    parts: loadedParts,
                    appendices: loadedAppendices
                }),
                getArticlesMap: () => loadedArticles,
                getParts: () => loadedParts,
                getAppendicesMap: () => loadedAppendices,
                getTotalCount: () => {
                    return Object.keys(loadedArticles || {}).length;
                },
                getAllIds: () => {
                    const keys = Object.keys(loadedArticles || {});
                    return keys.sort(naturalCompareSectionCodes);
                },
                getArticle: (id) => {
                    const key = String(id);
                    if (cache.has(key)) return cache.get(key);
                    let record = (loadedArticles && loadedArticles[key]) ? loadedArticles[key] : fallbackArticle(key);
                    if (!record.htmlContent && record.plainText) {
                        record.htmlContent = `<p>${record.plainText}</p>`;
                    }
                    cache.set(key, record);
                    return record;
                },
                query: ({ search = '', partId = 'all' } = {}) => {
                    const res = [];
                    const q = (search || '').toLowerCase().trim();
                    const allIds = AviationDB.getAllIds();

                    for (let id of allIds) {
                        const art = AviationDB.getArticle(id);
                        if (!art) continue;
                        if (partId !== 'all' && String(art.partId) !== String(partId)) continue;
                        if (q) {
                            const match = (art.title || '').toLowerCase().includes(q) ||
                                          (art.plainText || '').toLowerCase().includes(q) ||
                                          (art.code || '').toLowerCase().includes(q) ||
                                          String(art.id).toLowerCase() === q ||
                                          `điều ${art.id}`.toLowerCase().includes(q) ||
                                          `mục ${art.id}`.toLowerCase().includes(q) ||
                                          `section ${art.id}`.toLowerCase().includes(q);
                            if (!match) continue;
                        }
                        res.push(art);
                    }
                    return res;
                },
                queryAppendices: (search = '') => {
                    const q = (search || '').toLowerCase().trim();
                    const list = Object.values(loadedAppendices || {});
                    if (!q) return list;
                    return list.filter(app => 
                        (app.title || '').toLowerCase().includes(q) || 
                        (app.code || '').toLowerCase().includes(q) ||
                        (app.plainText || '').toLowerCase().includes(q)
                    );
                }
            };
        })();

                    alert("Không thể xóa tài liệu chính!");
                    return;
                }
                if (!confirm(`Bạn có chắc chắn muốn XÓA VĨNH VIỄN tài liệu "${docName}" khỏi CSDL IndexedDB?`)) return;

                await WorkspaceDB.remove(docId);
                const updatedDocs = docs.filter(d => d.id !== docId);
                setDocs(updatedDocs);
                await WorkspaceDB.put('docs_meta', updatedDocs);
                if (activeDocId === docId) {
                    await switchDoc(updatedDocs[0]?.id || 'main');
                }
                await refreshStoredRegistry();
                notify(`✅ Đã xóa vĩnh viễn "${docName}"!`);
            };

            const clearAllDatabase = async () => {
                if (!confirm("⚠️ CẢNH BÁO: XÓA SẠCH toàn bộ CSDL IndexedDB trên máy của bạn?")) return;

                await WorkspaceDB.clearAll();
                const defaultDocs = [{ id: 'main', name: 'Bộ Quy Chế (Chính)', type: 'docx' }];
                setDocs(defaultDocs);
                setActiveDocId('main');
                setDocData(null);
                AviationDB.setLoadedPackage(null);
                setDataCount(0);
                setAppendixCount(0);
                setSavedRegistry([]);
                setResetModal(false);
                notify("✅ Đã xóa toàn bộ CSDL IndexedDB!");
            };

            const handleRenameDocument = async (docId, currentName) => {
                const newName = prompt("Nhập tên hiển thị mới cho tài liệu:", currentName || "");
                if (!newName || !newName.trim() || newName.trim() === currentName) return;

                const cleanNewName = newName.trim();
                const updatedDocs = docs.map(d => d.id === docId ? { ...d, name: cleanNewName } : d);
                setDocs(updatedDocs);
                await WorkspaceDB.put('docs_meta', updatedDocs);

                let pkg = await WorkspaceDB.get(docId);
                if (pkg) {
                    pkg.name = cleanNewName;
                    await WorkspaceDB.put(docId, pkg);
                    if (activeDocId === docId) {
                        setDocData({ ...pkg });
                    }
                }
                await refreshStoredRegistry();
                notify("✅ Đã đổi tên tài liệu thành công!");
            };

            const isEnglishDoc = useMemo(() => {
                if (!docData || !docData.articles) return false;
                const sampleTexts = Object.values(docData.articles).slice(0, 8).map(a => `${a.title} ${a.plainText}`).join(' ');
                const vietnamesePattern = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđĐ]/i;
                return !vietnamesePattern.test(sampleTexts);
            }, [docData, activeDocId]);

            const handleDownloadOfflineData = async () => {
                try {
                    notify("⏳ Đang lưu dữ liệu vào bộ nhớ trình duyệt để chạy Offline...");

                    let packageMeta = null;
                    let packageData = {};

                    if (onlineWorkspaceData && onlineWorkspaceData.meta) {
                        packageMeta = onlineWorkspaceData.meta;
                        packageData = onlineWorkspaceData.data || {};
                    } else if (isStandaloneMode && EMBEDDED_WORKSPACE && EMBEDDED_WORKSPACE.meta) {
                        packageMeta = EMBEDDED_WORKSPACE.meta;
                        packageData = EMBEDDED_WORKSPACE.data || {};
                    }

                    if (!packageMeta || Object.keys(packageData).length === 0) {
                        const allEntries = await WorkspaceDB.getAllEntries();
                        if (allEntries && allEntries.length > 0) {
                            packageMeta = docs;
                            allEntries.forEach(entry => {
                                if (entry.key !== 'docs_meta') {
                                    packageData[entry.key] = entry.data;
                                }
                            });
                        } else if (docData) {
                            packageMeta = docs;
                            packageData[activeDocId] = docData;
                        }
                    }

                    if (!packageMeta || Object.keys(packageData).length === 0) {
                        alert("⚠️ Không tìm thấy nguồn dữ liệu để lưu offline!");
                        return;
                    }

                    await WorkspaceDB.put('docs_meta', packageMeta);
                    for (const docKey of Object.keys(packageData)) {
                        await WorkspaceDB.put(docKey, packageData[docKey]);
                    }

                    setDocs(packageMeta);
                    await refreshStoredRegistry();
                    await loadDocData(activeDocId || packageMeta[0]?.id || 'main');

                    alert("🎉 Tải data thành công!\n\nToàn bộ quy chế và phụ lục đã được lưu vào bộ nhớ trình duyệt. Bạn có thể ngắt mạng mà vẫn mở tra cứu bình thường!");
                } catch (err) {
                    alert("❌ Lỗi khi tải dữ liệu offline: " + err.message);
                }
            };

            const executeFastTranslation = async (targetLangCode, targetLangName, targetArticle = null) => {
                setLangSelectModal({ isOpen: false, mode: 'all', article: null });

                let pkg = (activeDocId && docData) ? docData : await WorkspaceDB.get(activeDocId);
                if (!pkg || !pkg.articles || Object.keys(pkg.articles).length === 0) {
                    notify("⚠️ Tài liệu không có nội dung điều khoản để dịch!");
                    return;
                }

                const docIsEnglish = isEnglishDoc;
                const defaultDocLang = docIsEnglish ? 'en' : 'vi';

                if (targetLangCode === defaultDocLang) {
                    if (targetArticle) {
                        setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${targetArticle.id}`]: 'original' }));
                        notify(`🇻🇳 Đã chuyển mục ${targetArticle.code || targetArticle.id} về ngôn ngữ gốc!`);
                    } else {
                        handleResetAllToOriginal();
                    }
                    return;
                }

                const articlesList = targetArticle ? [pkg.articles[targetArticle.id] || targetArticle] : Object.values(pkg.articles);
                const updatedCache = { ...translatedCache };
                const pendingArticles = [];

                articlesList.forEach(art => {
                    const cacheKey = `${activeDocId}_art_${art.id}_${targetLangCode}`;
                    const legacyKey = `${activeDocId}_art_${art.id}`;

                    const existingTranslation = 
                        (art.translations && art.translations[targetLangCode]) ||
                        updatedCache[cacheKey] ||
                        translatedCache[cacheKey] ||
                        (art.translatedText && (targetLangCode === 'en' || targetLangCode === (docIsEnglish ? 'vi' : 'en')) ? art.translatedText : null) ||
                        translatedCache[legacyKey];

                    if (!art.plainText || !art.plainText.trim()) {
                        if (!art.translations) art.translations = {};
                        art.translations[targetLangCode] = art.title || '';
                        updatedCache[cacheKey] = art.title || '';
                    } else if (existingTranslation) {
                        if (!art.translations) art.translations = {};
                        art.translations[targetLangCode] = existingTranslation;
                        updatedCache[cacheKey] = existingTranslation;
                    } else {
                        pendingArticles.push(art);
                    }
                });

                if (pendingArticles.length === 0) {
                    setTranslatedCache(updatedCache);

                    if (targetArticle) {
                        setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${targetArticle.id}`]: targetLangCode }));
                        notify(`✅ Đã chuyển mục sang ${targetLangName}!`);
                    } else {
                        setGlobalLangMode(prev => ({ ...prev, [activeDocId]: targetLangCode }));
                        const updatedViewModes = { ...articleViewModes };
                        Object.values(pkg.articles).forEach(art => {
                            updatedViewModes[`${activeDocId}_art_${art.id}`] = targetLangCode;
                        });
                        setArticleViewModes(updatedViewModes);
                        notify(`✅ Đã chuyển toàn bộ sang ${targetLangName}!`);
                    }
                    return;
                }

                batchTranslateAbortRef.current = false;
                batchTranslatePauseRef.current = false;

                if (!targetArticle && pendingArticles.length > 1) {
                    setBatchTranslateModal({
                        isOpen: true,
                        isRunning: true,
                        isPaused: false,
                        current: 0,
                        total: pendingArticles.length,
                        docId: activeDocId,
                        docName: activeDocName,
                        targetLangName: targetLangName
                    });
                }

                let completed = 0;
                for (let i = 0; i < pendingArticles.length; i++) {
                    if (batchTranslateAbortRef.current) break;
                    while (batchTranslatePauseRef.current) {
                        await new Promise(r => setTimeout(r, 300));
                        if (batchTranslateAbortRef.current) break;
                    }
                    if (batchTranslateAbortRef.current) break;

                    const art = pendingArticles[i];
                    const cacheKey = `${activeDocId}_art_${art.id}_${targetLangCode}`;

                    try {
                        const fullText = `${art.title}\n\n${art.plainText}`.trim();
                        if (!fullText) {
                            if (!art.translations) art.translations = {};
                            art.translations[targetLangCode] = art.title || '';
                            updatedCache[cacheKey] = art.title || '';
                        } else {
                            const translated = await quickGoogleTranslate(fullText, targetLangCode, 'auto');
                            const finalTrans = translated || fullText;
                            if (!art.translations) art.translations = {};
                            art.translations[targetLangCode] = finalTrans;
                            if (targetLangCode === 'en' || targetLangCode === 'vi') {
                                art.translatedText = finalTrans;
                            }
                            updatedCache[cacheKey] = finalTrans;
                        }
                    } catch (err) {
                        console.error(`Lỗi dịch mục ${art.code || art.id}:`, err);
                        if (!art.translations) art.translations = {};
                        art.translations[targetLangCode] = art.plainText;
                        updatedCache[cacheKey] = art.plainText;
                    }

                    completed++;
                    if (!targetArticle && pendingArticles.length > 1) {
                        setBatchTranslateModal(prev => ({ ...prev, current: completed }));
                    }

                    if (completed % 5 === 0 || completed === pendingArticles.length) {
                        await WorkspaceDB.put(activeDocId, pkg);
                    }
                }

                await WorkspaceDB.put(activeDocId, pkg);
                AviationDB.setLoadedPackage(pkg);
                setDocData({ ...pkg });
                setTranslatedCache(updatedCache);

                if (targetArticle) {
                    setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${targetArticle.id}`]: targetLangCode }));
                    notify(`✅ Đã dịch mục sang ${targetLangName}!`);
                } else {
                    setGlobalLangMode(prev => ({ ...prev, [activeDocId]: targetLangCode }));
                    const updatedViewModes = { ...articleViewModes };
                    Object.values(pkg.articles).forEach(art => {
                        updatedViewModes[`${activeDocId}_art_${art.id}`] = targetLangCode;
                    });
                    setArticleViewModes(updatedViewModes);
                    setBatchTranslateModal(prev => ({ ...prev, isRunning: false }));
                    notify(`🎉 Đã dịch xong và chuyển sang ${targetLangName}!`);
                }
            };

            const handleResetAllToOriginal = () => {
                setGlobalLangMode(prev => ({ ...prev, [activeDocId]: 'original' }));
                const updatedViewModes = { ...articleViewModes };
                if (docData && docData.articles) {
                    Object.values(docData.articles).forEach(art => {
                        updatedViewModes[`${activeDocId}_art_${art.id}`] = 'original';
                    });
                }
                setArticleViewModes(updatedViewModes);
                notify("🇻🇳 Đã chuyển toàn bộ các điều về văn bản gốc!");
            };

            const handleResetSingleArticleToOriginal = (art) => {
                if (!art) return;
                setArticleViewModes(prev => ({ ...prev, [`${activeDocId}_art_${art.id}`]: 'original' }));
                notify(`🇻🇳 Đã chuyển mục ${art.code || art.id} về bản gốc!`);
            };

            const getArticleDisplayText = (art) => {
                if (!art) return '';
                const artMode = articleViewModes[`${activeDocId}_art_${art.id}`] || globalLangMode[activeDocId] || 'original';
                if (artMode === 'original') {
                    return art.plainText || '';
                }
                const targetLang = artMode;
                const cacheKey = `${activeDocId}_art_${art.id}_${targetLang}`;
                const legacyKey = `${activeDocId}_art_${art.id}`;
                return (
                    (art.translations && art.translations[targetLang]) ||
                    translatedCache[cacheKey] ||
                    (targetLang === 'en' && art.translatedText) ||
                    (targetLang === 'vi' && art.translatedText) ||
                    translatedCache[legacyKey] ||
                    art.plainText || ''
                );
            };

            const handleHyperlinkJump = async ({ code, isAppendix, raw }) => {
                if (!code) return;
                const cleanCode = code.trim();
                const currentApps = AviationDB.getAppendicesMap() || {};
                const currentArts = AviationDB.getArticlesMap() || {};

                const summaries = [];
                for (const d of docs) {
                    let p = null;
                    if (d.id === activeDocId && docData) {
                        p = docData;
                    } else if (isStandaloneMode && EMBEDDED_WORKSPACE?.data?.[d.id]) {
                        p = EMBEDDED_WORKSPACE.data[d.id];
                    } else {
                        p = await WorkspaceDB.get(d.id);
                    }

                    let matchFound = null;
                    let matchType = '';

                    if (p && p.articles) {
                        const artMatch = Object.values(p.articles).find(a => 
                            String(a.id).trim().toLowerCase() === cleanCode.toLowerCase() ||
                            (a.code && a.code.toLowerCase().replace(/^(?:điều|mục|section)\s*/i, '').trim() === cleanCode.toLowerCase()) ||
                            (a.code && a.code.toLowerCase() === cleanCode.toLowerCase())
                        );
                        if (artMatch) {
                            matchFound = artMatch;
                            matchType = 'article';
                        }
                    }

                    if (!matchFound && p && p.appendices) {
                        const appMatch = Object.values(p.appendices).find(app => 
                            String(app.id).toLowerCase() === cleanCode.toLowerCase() ||
                            String(app.code || '').toLowerCase() === cleanCode.toLowerCase() ||
                            (app.code && app.code.toLowerCase().replace(/^(?:phụ lục|appendix)\s*/i, '').trim() === cleanCode.toLowerCase())
                        );
                        if (appMatch) {
                            matchFound = appMatch;
                            matchType = 'appendix';
                        }
                    }

                    summaries.push({
                        docId: d.id,
                        docName: d.name,
                        docType: d.type || 'docx',
                        hasMatch: Boolean(matchFound),
                        matchType: matchType,
                        matchItem: matchFound
                    });
                }

                setSelectorModal({
                    isOpen: true,
                    code: cleanCode,
                    raw: raw || code,
                    isAppendix: isAppendix,
                    fromTab: tab,
                    fromId: tab === 'appendices' ? singleAppendixKey : singleId,
                    fromDocId: activeDocId,
                    fromDocName: activeDocName,
                    fromLabel: tab === 'appendices' ? (currentApps[singleAppendixKey]?.title || 'Phụ lục') : (currentArts[singleId]?.code || `Mục ${singleId}`),
                    docSummaries: summaries
                });
            };

            const handleSelectDocumentToOpen = async (summaryItem) => {
                const targetDocId = summaryItem.docId;
                const { code, fromTab, fromId, fromDocId, fromDocName, fromLabel } = selectorModal;
                setSelectorModal(prev => ({ ...prev, isOpen: false }));

                if (targetDocId !== activeDocId) {
                    await loadDocData(targetDocId);
                }

                if (summaryItem.hasMatch && summaryItem.matchItem) {
                    if (summaryItem.matchType === 'appendix') {
                        setJumpHistory({
                            targetDocId: targetDocId,
                            targetId: summaryItem.matchItem.id,
                            targetType: 'appendices',
                            fromDocId: fromDocId,
                            fromDocName: fromDocName,
                            fromTab: fromTab,
                            fromId: fromId,
                            fromLabel: fromLabel
                        });
                        setSingleAppendixKey(summaryItem.matchItem.id);
                        setTab('appendices');
                        notify(`📍 Đã mở [${summaryItem.matchItem.title}] trong "${summaryItem.docName}"`);
                        return;
                    } else {
                        setJumpHistory({
                            targetDocId: targetDocId,
                            targetId: summaryItem.matchItem.id,
                            targetType: 'single',
                            fromDocId: fromDocId,
                            fromDocName: fromDocName,
                            fromTab: fromTab,
                            fromId: fromId,
                            fromLabel: fromLabel
                        });
                        setSingleId(summaryItem.matchItem.id);
                        setTab('single');
                        notify(`📍 Đã mở [${summaryItem.matchItem.code || summaryItem.matchItem.id}] trong "${summaryItem.docName}"`);
                        return;
                    }
                }

                setSearch(code);
                setTab('all');
                notify(`🔍 Tìm kiếm "${code}" trong "${summaryItem.docName}"`);
            };

            const handleDirectJumpFromAi = async (ref) => {
                if (!ref) return;
                try {
                    const targetDocId = ref.docId || activeDocId;
                    const targetDocName = ref.docName || activeDocName;

                    if (targetDocId !== activeDocId) {
                        await loadDocData(targetDocId);
                    }

                    setJumpHistory({
                        targetDocId: targetDocId,
                        targetId: ref.id,
                        targetType: ref.type === 'appendix' ? 'appendices' : 'single',
                        fromDocId: activeDocId,
                        fromDocName: activeDocName,
                        fromTab: tab,
                        fromId: tab === 'appendices' ? singleAppendixKey : singleId,
                        fromLabel: 'Trợ lý AI'
                    });

                    if (ref.type === 'appendix') {
                        setSingleAppendixKey(ref.id);
                        setTab('appendices');
                    } else {
                        setSingleId(ref.id);
                        setTab('single');
                    }

                    notify(`📍 Đã mở [${ref.code}] trong tài liệu "${targetDocName}"`);
                } catch (err) {
                    console.error("Lỗi direct jump:", err);
                    notify("❌ Không thể mở tài liệu: " + err.message);
                }
            };

            const handleGoBackJump = async () => {
                if (!jumpHistory) return;
                const prev = jumpHistory;
                setJumpHistory(null);

                if (prev.fromDocId && prev.fromDocId !== activeDocId) {
                    await loadDocData(prev.fromDocId);
                }

                if (prev.fromTab === 'appendices') {
                    setSingleAppendixKey(prev.fromId);
                    setTab('appendices');
                } else if (prev.fromTab === 'single') {
                    setSingleId(prev.fromId);
                    setTab('single');
                } else {
                    setTab(prev.fromTab || 'all');
                }
                notify(`↩️ Đã quay về: ${prev.fromLabel} (${prev.fromDocName})`);
            };

            const saveApiKey = (key) => {
                const clean = (key || '').trim();
                setAiApiKey(clean);
                localStorage.setItem('gemini_api_key', clean);
                setShowKeySetting(false);
                notify("✅ Đã lưu Gemini API Key!");
            };

            const scanAvailableModels = async () => {
                const cleanKey = (tempApiKey || aiApiKey || '').trim();
                if (!cleanKey) {
                    notify("⚠️ Vui lòng nhập API Key trước khi quét model!");
                    return;
                }
                setIsScanningModels(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`);
                    const data = await res.json();
                    if (data && data.models) {
                        const valid = data.models
                            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
                            .map(m => m.name.replace(/^models\//, ''))
                            .filter(name => /gemini/i.test(name));
                        if (valid.length > 0) {
                            setAvailableAiModels(valid);
                            if (!valid.includes(selectedModel)) {
                                setSelectedModel(valid[0]);
                                localStorage.setItem('gemini_model', valid[0]);
                            }
                            notify(`✅ Đã tìm thấy ${valid.length} mô hình Gemini khả dụng!`);
                        } else {
                            notify("⚠️ Không tìm thấy mô hình Gemini nào hỗ trợ chat.");
                        }
                    } else {
                        notify("❌ " + (data?.error?.message || "Không thể lấy danh sách mô hình"));
                    }
                } catch (e) {
                    notify("❌ Lỗi quét model: " + e.message);
                } finally {
                    setIsScanningModels(false);
                }
            };

            // TRỢ LÝ AI TRÍCH XUẤT CĂN CỨ TỪ CẢ CÁC ĐIỀU KHOẢN VÀ TOÀN VĂN PHỤ LỤC
            const handleSendAiMessage = async (overridePrompt = null) => {
                const promptToSend = overridePrompt || aiInput;
                if (!promptToSend || !promptToSend.trim()) return;

                let cleanKey = (aiApiKey || '').trim();
                if (!cleanKey) {
                    setShowKeySetting(true);
                    notify("⚠️ Vui lòng nhập Gemini API Key để trò chuyện với Trợ lý AI!");
                    return;
                }

                const userMsg = {
                    role: 'user',
                    text: promptToSend.trim(),
                    attachment: aiAttachment ? { name: aiAttachment.name } : null,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setAiMessages(prev => [...prev, userMsg]);
                if (!overridePrompt) setAiInput('');
                const currentAttachment = aiAttachment;
                setAiAttachment(null);
                setAiLoading(true);

                try {
                    let contextArticles = "";
                    let contextAppendices = "";
                    const qLower = promptToSend.toLowerCase();

                    // 1. Quét tìm trong danh mục Điều khoản
                    if (docData && docData.articles) {
                        const arts = Object.values(docData.articles);
                        const matched = arts.filter(a => 
                            qLower.includes(String(a.id).toLowerCase()) || 
                            (a.code && qLower.includes(String(a.code).toLowerCase())) ||
                            a.title.toLowerCase().split(' ').some(w => w.length > 3 && qLower.includes(w))
                        ).slice(0, 5);

                        if (matched.length > 0) {
                            contextArticles = "\n\nCĂN CỨ TỪ CÁC ĐIỀU KHOẢN (" + activeDocName + "):\n" +
                                matched.map(m => `[${m.code || m.id}] ${m.title}\n${(m.plainText || '').substring(0, 1200)}`).join('\n---\n');
                        } else {
                            contextArticles = "\n\nDANH MỤC ĐIỀU KHOẢN TÀI LIỆU (" + activeDocName + "):\n" +
                                arts.slice(0, 20).map(m => `- [${m.code || m.id}] ${m.title}`).join('\n');
                        }
                    }

                    // 2. Quét sâu vào toàn văn nội dung các Phụ lục trong CSDL ngầm
                    if (docData && docData.appendices) {
                        const apps = Object.values(docData.appendices);
                        const matchedApps = apps.filter(app =>
                            qLower.includes(String(app.id).toLowerCase()) ||
                            (app.code && qLower.includes(String(app.code).toLowerCase())) ||
                            app.title.toLowerCase().split(' ').some(w => w.length > 3 && qLower.includes(w)) ||
                            (app.plainText && qLower.split(' ').filter(w => w.length > 3).some(w => app.plainText.toLowerCase().includes(w)))
                        ).slice(0, 3);

                        if (matchedApps.length > 0) {
                            contextAppendices = "\n\nCĂN CỨ TỪ NỘI DUNG CÁC PHỤ LỤC & BIỂU MẪU ĐÍNH KÈM (" + activeDocName + "):\n" +
                                matchedApps.map(m => `[PHỤ LỤC ${m.code || m.id}] ${m.title}\n${(m.plainText || '').substring(0, 2000)}`).join('\n---\n');
                        }
                    }

                    const systemInstruction = `Bạn là Trợ lý Pháp chế & Kỹ thuật An toàn Hàng không cấp cao chuyên về Luật Hàng không Việt Nam, Quy chế An toàn Hàng không (VARs), CAME, MOE và các tiêu chuẩn ICAO/EASA/FAA.
Nhiệm vụ: Trả lời chính xác, trích dẫn rõ Điều, Khoản, Mục, Phụ lục căn cứ pháp lý. Phân tích cụ thể trách nhiệm, thẩm quyền, quy trình an toàn hàng không.

${contextArticles}
${contextAppendices}`;

                    const parts = [{ text: `${systemInstruction}\n\nNgười dùng hỏi: ${promptToSend.trim()}` }];

                    if (currentAttachment && currentAttachment.data) {
                        const mimeType = currentAttachment.type || 'text/plain';
                        if (mimeType.startsWith('image/')) {
                            const b64Data = currentAttachment.data.includes(',') ? currentAttachment.data.split(',')[1] : currentAttachment.data;

            const analyzeComparisonRowsWithAI = async (row) => {

                if (!cleanKey) {

                const selectedBList = selectedCodes.map(c => {

                }).join('\n\n');

                const prompt = `Bạn là chuyên gia thẩm định và đối chiếu Pháp chế & Kỹ thuật An toàn Hàng không.
Nhiệm vụ: So sánh, đối chiếu và phân tích sự khác biệt giữa:
- [TÀI LIỆU GỐC (A)]: ${compareModalState.sourceDocName} - Mục ${row.codeA}: ${row.titleA}
Nội dung: ${row.textA}

- [TÀI LIỆU ĐỐI CHIẾU (B)]: ${compareModalState.targetDocName} - Các mục đã chọn (${selectedCodes.join(', ')})
Nội dung:
${selectedBList}

HÃY THỰC HIỆN:
1. So sánh chi tiết sự tương đồng và khác biệt về mặt nội dung, quy trình, yêu cầu kỹ thuật, thẩm quyền, thời hạn.
2. Chỉ rõ cụ thể các điểm:
   - Điểm mới / Bổ sung
   - Sửa đổi / Thay thế
   - Bãi bỏ / Khác biệt

YÊU CẦU ĐỊNH DẠNG: Trả về ĐÚNG 1 JSON OBJECT hoặc JSON ARRAY:
[
  {
    "codeA": "${row.codeA}",
    "analysis": "Tóm tắt ngắn gọn 2-3 câu về điểm khác biệt cốt lõi",
    "detailedPoints": [
      "Điểm mới / Bổ sung: ...",
      "Sửa đổi / Thay thế: ...",
      "Bãi bỏ / Khác biệt: ..."
    ]
  }
]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${encodeURIComponent(cleanKey)}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { 
                            temperature: 0.1,
                            responseMimeType: "application/json"
                        }
                    })
                });

                const resData = await response.json();
                if (resData.error) {
                    throw new Error(`Lỗi Google API: ${resData.error.message || 'Yêu cầu không hợp lệ'}`);
                }

                const rawReply = resData?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawReply) {
                    throw new Error("Không nhận được nội dung phản hồi từ AI.");
                }

                const parsed = solidParseJson(rawReply);
                return Array.isArray(parsed) ? parsed[0] : parsed;
            };

            const runSingleRowAiComparison = async (targetRow) => {
                if (!targetRow.selectedCodesB || targetRow.selectedCodesB.length === 0) {
                    notify("⚠️ Vui lòng chọn ít nhất 1 Điều/Mục ở Cột 2 trước khi phân tích!");

                try {
                    targetRow.isAnalyzing = true;
                    setCompareModalState(prev => ({ ...prev, rows: [...prev.rows] }));
                    notify(`🤖 AI đang phân tích khác biệt cho mục ${targetRow.codeA}...`);

                    const resItem = await analyzeComparisonRowsWithAI(targetRow);

                    if (resItem) {
                        targetRow.aiAnalysis = resItem.analysis || 'Đã phân tích';
                        targetRow.detailedPoints = resItem.detailedPoints || [];
                        targetRow.isAnalyzed = true;
                    }
                } catch (err) {
                    targetRow.aiAnalysis = "Lỗi đối chiếu AI: " + err.message;

                    targetRow.isAnalyzing = false;

            const runAiBatchComparison = async () => {
                const rowsWithSelection = compareModalState.rows.filter(r => r.selectedCodesB && r.selectedCodesB.length > 0 && !r.isAnalyzed);
                if (rowsWithSelection.length === 0) {
                    notify("⚠️ Chưa có dòng nào được chọn Điều/Mục ở Cột 2 hoặc tất cả đã được phân tích!");
                    return;
                }

                compareAbortRef.current = false;
                comparePauseRef.current = false;

                setCompareModalState(prev => ({ ...prev, isAnalyzing: true, compareStatus: 'running' }));
                notify(`🤖 AI đang phân tích ${rowsWithSelection.length} dòng đã chọn...`);

                const rows = [...compareModalState.rows];

                for (let i = 0; i < rowsWithSelection.length; i++) {
                    if (compareAbortRef.current) {
                        notify("⏹️ Đã dừng tiến trình so sánh theo yêu cầu.");
                        break;
                    }

                    while (comparePauseRef.current) {
                        await new Promise(r => setTimeout(r, 400));
                        if (compareAbortRef.current) break;
                    }
                    if (compareAbortRef.current) break;

                    const rowItem = rowsWithSelection[i];
                    rowItem.isAnalyzing = true;
                    setCompareModalState(prev => ({ ...prev, rows: [...rows] }));

                    try {
                        const resItem = await analyzeComparisonRowsWithAI(rowItem);
                        if (resItem) {
                            rowItem.aiAnalysis = resItem.analysis || 'Đã phân tích';
                            rowItem.detailedPoints = resItem.detailedPoints || [];
                            rowItem.isAnalyzed = true;
                        }
                    } catch (err) {
                        rowItem.aiAnalysis = "Lỗi đối chiếu AI: " + err.message;
                    } finally {
                        rowItem.isAnalyzing = false;
                        const completedCount = rows.filter(r => r.isAnalyzed).length;
                        setCompareModalState(prev => ({
                            ...prev,
                            rows: [...rows],
                            analyzedCount: completedCount
                        }));
                    }
                }

                setCompareModalState(prev => ({ ...prev, isAnalyzing: false, compareStatus: 'idle' }));
                if (!compareAbortRef.current) {
                    notify("🎉 Đã hoàn tất phân tích khác biệt các dòng đã chọn!");
                }
            };

            const pauseBatchComparison = () => {

            const handleUploadAppendixWord = (appKey, file) => {

                if (!isWord) {

                notify(`Đang lưu trữ file Word: ${file.name}...`);

                    if (!pkg.appendices) pkg.appendices = AviationDB.getAppendicesMap() || {};
                    if (!pkg.appendices[appKey]) {
                        pkg.appendices[appKey] = { id: appKey, code: appKey, title: `Phụ lục`, plainText: "Biểu mẫu", pdfFileName: "", pdfFileUrl: "", wordFileName: "", wordFileUrl: "" };
                    }
                    pkg.name = activeDocName;

                    await WorkspaceDB.put(activeDocId, pkg);
                    AviationDB.setLoadedPackage(pkg);
                    setDocData({ ...pkg });
                    setAppendixCount(Object.keys(pkg.appendices).length);
                    notify(`✅ Đã lưu Word cho ${pkg.appendices[appKey].title}!`);

                reader.readAsArrayBuffer(file);
